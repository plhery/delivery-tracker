<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Passport refinements</title>
<style>
:root{color-scheme: light;
  --yellow: #f3cf48; --on-yellow: #20251e; --yellow-soft: #ffebab;
  --ink: #20251e; --ink-soft: #657060; --canvas: #f4f5f1; --paper: #fff;
  --control: #eceee7; --line: #dce0d5; --green: #24613e; --green-soft: #dcf0d7;
  --blue: #22588a; --blue-soft: #daeafe; --orange: #963e19; --orange-text: #963e19; --orange-soft: #ffddc7;
  --lilac: #654299; --lilac-soft: #e9deff; --rose: #9a3d5c; --rose-soft: #fadde7;
  --ochre: #745300; --ochre-soft: #ffebab;
  --shadow: 0 3px 15px rgb(25 35 20 / 4%);
  --ease-out: cubic-bezier(.2,.8,.2,1); --spring: cubic-bezier(.22,1,.36,1);
  --z-popover: 90;--page:var(--canvas);--muted:var(--ink-soft)}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--page);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,select{font:inherit;color:inherit;cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #7b8ea1;outline-offset:4px}button{border:0}main{max-width:1270px;margin:auto;padding:31px 34px 46px}.mast{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:20px;font-size:12px}.mast strong{font-weight:600}.mast a{color:var(--muted);text-decoration:none}h1{font-size:31px;font-weight:600;letter-spacing:-1px;line-height:1.2;margin:30px 0 11px}.intro{font-size:13px;color:var(--muted);margin:0 0 25px}.controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:31px}.segments{display:flex;gap:3px;background:var(--control);padding:4px;border-radius:11px}.segments button{background:none;border-radius:8px;font-size:12px;padding:7px 12px;color:var(--muted)}.segments button[aria-pressed=true]{background:var(--paper);color:var(--ink)}.controls label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}select{background:var(--paper);border:1px solid var(--line);padding:7px 10px;border-radius:9px;font-size:12px}.theme{margin-left:auto;border:1px solid var(--line);border-radius:9px;padding:7px 11px;background:none;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px;align-items:start}.proposal{min-width:0}.caption{height:63px}.caption h2{font-size:15px;margin:0 0 4px;letter-spacing:-.15px;font-weight:600}.caption p{font-size:12px;margin:0;color:var(--muted)}.screen{--sheet:var(--canvas);--cover:var(--yellow);--text:var(--ink);--soft:var(--ink-soft);--rule:var(--line);--stamp-paper:var(--green-soft);--stamp-ink:var(--green);background:var(--sheet);border:1px solid var(--line);border-radius:25px;padding:25px 22px 18px;color:var(--text)}.screen h3{font-size:23px;font-weight:600;letter-spacing:-.7px;margin:0 0 25px}.cover{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--cover);padding:26px 24px;border-radius:19px;min-height:170px}.number{font-size:53px;letter-spacing:-2px;line-height:1;font-weight:600;display:block}.delivered{font-size:13px;margin-top:9px;display:block;color:var(--soft)}.cover{color:var(--on-yellow)}.cover .delivered{color:var(--on-yellow);opacity:.7}.cover .seal{--stamp-paper:var(--paper);--stamp-ink:#745300}.stamp-button[data-stamp="ten"] .seal{--stamp-paper:var(--lilac-soft);--stamp-ink:var(--lilac)}.stamp-button[data-stamp="connected"] .seal{--stamp-paper:var(--blue-soft);--stamp-ink:var(--blue)}.stamp-button[data-stamp="express"] .seal{--stamp-paper:var(--orange-soft);--stamp-ink:var(--orange)}.seal{display:block;position:relative;flex-shrink:0;width:54px;height:67px;padding:7px;background:var(--stamp-paper);color:var(--stamp-ink);clip-path:polygon(0 4%,5% 0,11% 4%,17% 0,23% 4%,29% 0,35% 4%,41% 0,47% 4%,53% 0,59% 4%,65% 0,71% 4%,77% 0,83% 4%,89% 0,95% 4%,100% 0,96% 7%,100% 14%,96% 21%,100% 28%,96% 35%,100% 42%,96% 49%,100% 56%,96% 63%,100% 70%,96% 77%,100% 84%,96% 91%,100% 98%,94% 100%,88% 96%,82% 100%,76% 96%,70% 100%,64% 96%,58% 100%,52% 96%,46% 100%,40% 96%,34% 100%,28% 96%,22% 100%,16% 96%,10% 100%,4% 96%,0 100%,4% 91%,0 85%,4% 79%,0 73%,4% 67%,0 61%,4% 55%,0 49%,4% 43%,0 37%,4% 31%,0 25%,4% 19%,0 13%,4% 7%)}.seal-inner{border:1px solid color-mix(in srgb,var(--stamp-ink) 42%,transparent);height:100%;display:grid;place-items:center}.seal svg{width:24px;height:24px;stroke:currentColor;stroke-width:1.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.cover .seal{width:66px;height:80px;transform:rotate(-7deg)}.cover .seal:after{content:'';position:absolute;right:-3px;bottom:7px;width:31px;height:31px;border-radius:50%;border:1px solid currentColor;outline:1px solid currentColor;outline-offset:-5px;opacity:.2}.locked .seal{opacity:.27;filter:grayscale(1)}.locked .stamp-label{color:var(--soft)}.section{margin-top:29px}.section-heading{display:flex;align-items:center;gap:4px;margin-bottom:14px;min-height:24px}.section-heading h4{font-size:13px;font-weight:600;letter-spacing:-.1px;margin:0}.country-heading{background:none;padding:0;min-height:44px;margin:-10px 0;font:inherit;color:inherit;text-align:left;border-radius:6px}.shelf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.stamp-button{display:flex;flex-direction:column;align-items:center;min-width:0;text-align:center;background:none;padding:0;color:inherit}.stamp-button .seal{max-width:100%}.stamp-label{font-size:9px;line-height:1.4;font-weight:400;margin-top:9px}.times{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:21px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}.time{background:none;color:var(--text);padding:0;text-align:left}.time strong{font-size:22px;font-weight:500;letter-spacing:-.6px;display:block;line-height:1.2}.time span{font-size:10px;color:var(--soft);display:block;margin-top:6px}.country{display:flex;align-items:center;gap:11px;font-size:12px;padding:11px 0}.country+.country{border-top:1px solid var(--rule)}.flag{font-size:15px}.quantity{margin-left:auto;color:var(--soft);font-size:11px;font-variant-numeric:tabular-nums}.nav{display:flex;justify-content:center;gap:24px;border-top:1px solid var(--rule);margin-top:27px;padding-top:17px;font-size:10px;color:var(--soft)}.nav strong{font-weight:500;color:var(--text)}.empty-note{font-size:11px;line-height:1.6;color:var(--soft);margin:0}.compact .cover{border-radius:18px;min-height:170px}.compact .cover .seal{transform:rotate(5deg)}.compact .times{padding:0;border:0;display:block}.compact .time{display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center;width:100%;padding:11px 0}.compact .time+.time{border-top:1px solid var(--rule)}.compact .time strong{font-size:18px}.compact .time span{font-size:11px;margin:0}.compact .shelf{grid-template-columns:1fr 1fr;gap:15px 12px}.compact .stamp-button{flex-direction:row;text-align:left;gap:10px}.compact .stamp-button .seal{width:39px;height:49px;padding:5px}.compact .stamp-button .seal svg{width:20px;height:20px}.compact .stamp-label{font-size:10px;margin:0}.minimal{--cover:transparent}.minimal .cover{color:var(--ink);padding:6px 2px 24px;min-height:145px;border-radius:0;border-bottom:1px solid var(--rule)}.minimal .number{font-size:56px}.minimal .cover .seal{width:57px;height:70px;transform:rotate(-5deg);margin-right:4px}.minimal .cover .delivered{color:var(--soft)}.minimal .times{border:0;padding:0 2px}.minimal .time strong{font-size:21px}.minimal .shelf{background:var(--paper);border-radius:14px;padding:15px 11px 13px;gap:6px}.minimal .stamp-button .seal{width:43px;height:54px;padding:5px}.minimal .stamp-button .seal svg{width:20px;height:20px}.minimal .stamp-label{font-size:9px}.minimal .country{padding:10px 0}.foot{color:var(--muted);font-size:11px;margin:26px 0 0}.single .grid{grid-template-columns:minmax(0,385px);justify-content:center}.single .caption{height:auto;margin-bottom:16px}[popover]{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:15px;padding:19px;box-shadow:0 8px 32px #00000012;width:min(290px,calc(100vw - 32px));margin:0;position:fixed;inset:auto;max-height:calc(100vh - 32px);overflow:auto}[popover] h2{font-size:14px;margin:0 0 8px;font-weight:600}[popover] p{font-size:12px;line-height:1.65;margin:0;color:var(--muted)}.dark{color-scheme:dark;--page:var(--canvas);--muted:var(--ink-soft);color-scheme: dark;
  --ink: #f5f6f2; --ink-soft: #afb9a9; --canvas: #151915; --paper: #242824;
  --control: #2e342d; --line: #3e463b; --green: #9be0b5; --green-soft: #243d2e;
  --blue: #9bcbff; --blue-soft: #213a51; --orange: #ffb184; --orange-text: #ffb184; --orange-soft: #4c3123;
  --lilac: #d1b5ff; --lilac-soft: #382d4c; --rose: #ffadc8; --rose-soft: #482c39;
  --ochre: #ffd65f; --ochre-soft: #443918; --yellow-soft: #443918;
  --shadow: 0 3px 16px rgb(0 0 0 / 10%);}.dark .cover .seal{--stamp-paper:#fff}
@media(max-width:1040px){main{padding:25px 23px 40px}.grid{gap:17px}.screen{padding:23px 16px 17px}.cover{padding:23px 18px}.cover .seal{width:56px;height:70px}.seal{width:48px;height:60px}.shelf{gap:6px}.stamp-label{font-size:8px}.compact .stamp-button{gap:7px}.compact .stamp-button .seal{width:33px;height:43px}.compact .stamp-label{font-size:9px}.minimal .shelf{padding:13px 7px}.minimal .stamp-button .seal{width:38px;height:50px}.minimal .stamp-label{font-size:8px}.number{font-size:49px}}
@media(max-width:740px){main{padding:23px 20px 34px}h1{font-size:28px;margin-top:25px}.mast{font-size:11px}.intro{line-height:1.6}.controls{gap:11px}.segments{width:100%}.segments button{flex:1;padding:7px}.theme{margin-left:0}.grid{grid-template-columns:1fr;gap:30px}.caption{height:auto;margin-bottom:15px}.screen{padding:25px 21px 18px}.number{font-size:53px}.seal{width:54px;height:67px}.cover .seal{width:64px;height:78px}.stamp-label{font-size:9px}.shelf{gap:8px}.compact .stamp-button{gap:10px}.compact .stamp-button .seal{width:39px;height:49px}.compact .stamp-label{font-size:10px}.minimal .stamp-button .seal{width:43px;height:54px}.minimal .stamp-label{font-size:9px}.minimal .shelf{padding:15px 10px}.foot{line-height:1.6}}
</style></head>
<body><main>
<header class="mast"><strong>Passport</strong><a href="passport-concepts.html">Previous study</a></header>
<h1>Passport, simplified.</h1><p class="intro">Three layouts using the current app colors. Fewer labels, clearer hierarchy.</p>
<div class="controls"><nav class="segments" aria-label="Choose a proposal"><button type="button" data-view="all" aria-pressed="true">Compare</button><button type="button" data-view="journal" aria-pressed="false">1 Journal</button><button type="button" data-view="compact" aria-pressed="false">2 Compact</button><button type="button" data-view="minimal" aria-pressed="false">3 Minimal</button></nav><label>Sample<select id="sample"><option value="full">24 deliveries</option><option value="early">4 deliveries</option><option value="empty">Just starting</option></select></label><button type="button" class="theme" aria-pressed="false">Dark mode</button></div>
<div class="grid" id="proposals"></div><p class="foot">Sample data. Tap a stamp, a delivery time, or First seen in.</p>
</main>
<div id="help-popover" popover="auto" role="dialog" aria-labelledby="help-title"><h2 id="help-title"></h2><p id="help-body"></p></div>
<script>
const samples={full:{total:24,carriers:5,average:'3d 4h',best:'18h',timed:19,express:true,countries:[['🇨🇭','Switzerland',12],['🇩🇪','Germany',7],['🇫🇷','France',3]]},early:{total:4,carriers:2,average:'4d 6h',best:'2d 3h',timed:3,express:false,countries:[['🇨🇭','Switzerland',3],['🇩🇪','Germany',1]]},empty:{total:0,carriers:1,average:null,best:null,timed:0,express:false,countries:[]}};
const icons={parcel:'M3 7l9-5 9 5v10l-9 5-9-5V7Zm0 0 9 5 9-5M12 12v10M7.5 4.5l9 5',ten:'M5 6v12M3 8l2-2m7 2a3 3 0 0 1 6 0v8a3 3 0 0 1-6 0V8Z',globe:'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0ZM3 12h18M12 3c5 5 5 13 0 18-5-5-5-13 0-18Z',express:'m13 2-9 12h7l-1 8L21 9h-8l1-7'};
let data=samples.full,view='all';
function milestones(){return[{id:'first',title:'First arrival',icon:'parcel',earned:data.total>0,info:'Delivered your first parcel. Archived deliveries count too.'},{id:'ten',title:'Double digits',icon:'ten',earned:data.total>=10,info:`Ten delivered parcels. You have ${data.total}.`},{id:'connected',title:'Well connected',icon:'globe',earned:data.carriers>=3,info:`Track parcels with three different carriers. You have tracked ${data.carriers}.`},{id:'express',title:'Express arrival',icon:'express',earned:data.express,info:'A parcel delivered within 48 hours of its first physical acceptance or transit scan.'}]}
function seal(icon){return `<span class="seal" aria-hidden="true"><span class="seal-inner"><svg viewBox="0 0 24 24"><path d="${icons[icon]}"/></svg></span></span>`}
function cover(){return `<div class="cover"><div><strong class="number">${data.total}</strong><span class="delivered">delivered</span></div>${seal('parcel')}</div>`}
function stamps(){return `<section class="section"><div class="section-heading"><h4>Stamps</h4></div><div class="shelf">${milestones().map(m=>`<button class="stamp-button ${m.earned?'':'locked'}" type="button" data-stamp="${m.id}" aria-label="${m.title}, ${m.earned?'earned':'not earned yet'}">${seal(m.icon)}<span class="stamp-label">${m.title}</span></button>`).join('')}</div></section>`}
function times(){return `<section class="section" aria-label="Delivery times">${data.average?`<div class="times"><button class="time" type="button" data-time="average"><strong>${data.average}</strong><span>Average delivery</span></button><button class="time" type="button" data-time="best"><strong>${data.best}</strong><span>Fastest delivery</span></button></div>`:'<p class="empty-note">Delivery times appear after your first completed journey.</p>'}</section>`}
function countries(){return `<section class="section"><div class="section-heading"><h4><button class="country-heading" type="button" data-help="countries" aria-haspopup="dialog">First seen in</button></h4></div>${data.countries.length?data.countries.map(([flag,name,count])=>`<div class="country"><span class="flag" aria-hidden="true">${flag}</span><span>${name}</span><span class="quantity">${count}</span></div>`).join(''):'<p class="empty-note">Countries appear when tracking identifies the first physical scan.</p>'}</section>`}
const variants=[{id:'journal',title:'1 Journal',description:'The cover and stamps lead.'},{id:'compact',title:'2 Compact',description:'Timing first, with stamps in two columns.'},{id:'minimal',title:'3 Minimal',description:'An open header and a compact stamp shelf.'}];
function render(){data=samples[document.querySelector('#sample').value];document.querySelector('#proposals').innerHTML=variants.map(v=>`<article class="proposal" data-proposal="${v.id}" ${view!=='all'&&view!==v.id?'hidden':''}><header class="caption"><h2>${v.title}</h2><p>${v.description}</p></header><div class="screen ${v.id}"><h3>Passport</h3>${cover()}${v.id==='journal'?stamps()+times():times()+stamps()}${countries()}<div class="nav" aria-label="Navigation preview"><span>Deliveries</span><strong>Passport</strong><span>Friends</span></div></div></article>`).join('')}
function showHelp(button,title,body){const popup=document.querySelector('#help-popover');if(popup.matches(':popover-open'))popup.hidePopover();document.querySelector('#help-title').textContent=title;document.querySelector('#help-body').textContent=body;popup.showPopover({source:button});const rect=button.getBoundingClientRect();const width=popup.getBoundingClientRect().width;const height=popup.getBoundingClientRect().height;popup.style.left=Math.max(16,Math.min(innerWidth-width-16,rect.left-8))+'px';popup.style.top=Math.max(16,Math.min(innerHeight-height-16,rect.bottom+8))+'px'}
document.querySelector('#proposals').addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.help){showHelp(button,'First seen in','Countries named at the first physical acceptance or transit scan. This can differ from the sender’s location. Unknown locations are left out.');return}if(button.dataset.time){showHelp(button,button.dataset.time==='average'?'Average delivery':'Fastest delivery',`Based on ${data.timed} completed journeys with timing data. Timing starts at the first physical acceptance or transit scan, not when you add the parcel.`);return}if(button.dataset.stamp){const m=milestones().find(m=>m.id===button.dataset.stamp);showHelp(button,m.title,m.info)}});
document.querySelector('#sample').addEventListener('change',render);document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{view=button.dataset.view;document.body.classList.toggle('single',view!=='all');document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));render()}));document.querySelector('.theme').addEventListener('click',event=>{const dark=document.body.classList.toggle('dark');event.currentTarget.setAttribute('aria-pressed',String(dark));event.currentTarget.textContent=dark?'Light mode':'Dark mode'});render();
</script></body></html>
