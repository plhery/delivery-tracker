.parcel-illustration { display: block; width: 100%; overflow: visible; }
.parcel-illustration__body { transform-origin: 150px 210px;  }
.parcel-illustration__shadow { transform-origin: 150px 286px;  }
.parcel-illustration__flap { transform-origin: 0 0; transform: scaleY(1) skewX(0deg); transition: transform .72s var(--spring) .17s, opacity .3s .1s; }
.parcel-illustration__flap--rear { transition-duration: .62s, .3s; transition-delay: .07s, .05s; }
.parcel-illustration__flap--hidden { opacity: 0; }
.parcel-illustration__tape { transform-origin: 103px 119px; transition: opacity .22s .05s, transform .4s var(--ease-out); }
.parcel-illustration__delivery-card { opacity: 0; transform: translateY(22px) rotate(-11deg); transform-origin: 151px 174px; transition: transform .86s var(--spring) .25s, opacity .25s .23s; }
.parcel-illustration__check { stroke-dasharray: 25; stroke-dashoffset: 25; transition: stroke-dashoffset .38s ease-out .6s; }
.parcel-illustration__face-light { opacity: calc(.025 + (var(--parcel-x, 0) + 1) * .045); }
.parcel-illustration__edge { opacity: calc(.22 + (var(--parcel-x, 0) + 1) * .18); }
.parcel-illustration__seal-light { opacity: calc(.2 + (var(--parcel-y, 0) + 1) * .28); }
.parcel-illustration__glints, .parcel-illustration__light { opacity: 0; pointer-events: none; }
.parcel-illustration__sparkle { opacity: 0; transform-box: fill-box; transform-origin: center; }
.parcel-illustration__light { filter: blur(10px); }

.opening .parcel-illustration__flap { transform: scaleY(var(--fold-scale)) skewX(var(--fold-skew)); opacity: 1; }
.opening .parcel-illustration__tape { opacity: 0; transform: translate(-6px, -19px) rotate(-8deg); }
.opening .parcel-illustration__delivery-card { opacity: 1; transform: translateY(-69px) rotate(-5deg); }
.opening .parcel-illustration__check { stroke-dashoffset: 0; }
.icon-btn,.bottom-nav{background:var(--control)}.album button,.name-input{background:var(--paper)}
/* Soft postcards, refined: quiet rows; one moment of delight for the invitation. */
.friend{min-height:80px;padding:13px 15px}.friend-meta{margin-top:2px}.friend .arrival{margin-top:4px}.own-copy small{font-size:11px}.friend-name,.person-title,.preview-head strong{overflow-wrap:anywhere}.profile-hero{min-height:128px}.profile-hero .arrival{margin-top:12px}.profile-manage{margin-top:28px}.stamp-story[hidden]{min-height:0}.invitation-card{min-height:219px;margin-top:7px;margin-bottom:0}.invitation-top{margin-bottom:36px}.invitation-card h4{font-size:27px}.invitation-from{margin-top:0}.invitation-card+.action-stack{margin-top:18px}.compact-preview{margin-top:12px}.accept-card{padding:20px}.invitation-person{margin-top:7px;min-height:135px}.invitation-message{font-size:17px;line-height:1.4;letter-spacing:-.25px;margin:20px 0 28px;max-width:240px}.invitation-revealed{animation:postcard-reveal .45s ease-out}.invitation-revealed .section-row{margin-top:24px}.invitation-revealed .action-stack{margin-top:22px}.getting-started{display:flex;flex-direction:column;justify-content:center}.getting-started .start-art{height:121px;margin:6px 0 27px}.getting-started .action-stack{margin:30px 0 28px}.empty-circle p:empty{display:none}.tiny-list svg{width:14px;height:14px;vertical-align:-2px;margin-right:5px}.package-content{display:flex;flex-direction:column;justify-content:center;padding-bottom:53px}.package-intro{text-align:center;margin-top:9px}.package-intro .eyebrow{font-size:11px;letter-spacing:.6px;text-transform:none;margin-bottom:4px}.package-intro h4{font-size:30px;letter-spacing:-1px;margin:0;font-weight:650}.package-open{width:100%;padding:0;display:block;border-radius:22px;--spring:cubic-bezier(.22,.75,.2,1);--ease-out:cubic-bezier(.2,.7,.2,1)}.package-open:disabled{opacity:1}.package-art{display:block;max-width:300px;margin:-10px auto 5px;transition:transform .25s ease}.package-open:not(:disabled):hover .package-art{transform:translateY(-4px) rotate(-2deg)}.package-open:active .package-art{transform:scale(.97)}.package-hint{display:flex;gap:12px;align-items:center;justify-content:center;font-size:12px;color:var(--muted);transition:opacity .2s}.opening .package-hint{opacity:0}.package-open .parcel-illustration{width:100%;height:auto;stroke:none;stroke-linecap:butt;stroke-linejoin:miter}.opening .parcel-illustration__body{animation:package-unseal 1.1s ease-out both}.package-open .parcel-illustration__shadow{animation:none}.package-open .parcel-illustration__delivery-card circle{fill:var(--lilac)}
@keyframes package-unseal{0%{transform:translateY(0)}20%{transform:translateY(4px) rotate(-2deg)}45%{transform:translateY(-5px) rotate(1deg)}100%{transform:translateY(0)}}

/* Round three: tonal perforations, no white stamp tiles, stable sharing controls. */
.stamp,.dark .stamp{background:color-mix(in srgb,var(--tint) 81%,var(--tint-ink));padding:5px}
.stamp-inner,.dark .stamp-inner{background:transparent;border-color:color-mix(in srgb,var(--tint-ink) 34%,transparent)}
.album button{background:transparent}.album button:hover{background:color-mix(in srgb,var(--tint) 60%,transparent)}
.album .stamp{width:48px;height:59px}.album button[aria-pressed=true]{background:var(--tint);outline-color:color-mix(in srgb,var(--tint-ink) 35%,transparent)}
.preview-meta{display:grid;grid-template-rows:minmax(36px,auto) 18px;line-height:18px;margin-top:9px}.preview-numbers{display:block}.preview-arrival{display:block}.preview-arrival.is-absent{visibility:hidden}
/* Tape lifts first, then the rear and front folds, then the personal postcard. */
.package-art{transform-origin:50% 75%;transform:perspective(700px) rotateX(var(--tilt-y,0deg)) rotateY(var(--tilt-x,0deg));transition:transform .32s ease}
.package-open:not(:disabled):hover .package-art{transform:perspective(700px) rotateX(var(--tilt-y,0deg)) rotateY(var(--tilt-x,0deg)) translateY(-3px)}
.package-open.opening .package-art{transform:none}
.parcel-illustration__flap{transition:transform .72s cubic-bezier(.22,1,.36,1) .28s,opacity .18s .28s}
.parcel-illustration__flap--rear{transition-delay:.18s;transition-duration:.64s}
.parcel-illustration__tape{transition:opacity .23s .08s,transform .4s cubic-bezier(.2,.7,.2,1)}
.opening .parcel-illustration__tape{transform:translate(-11px,-27px) rotate(-14deg);opacity:0}
.parcel-illustration__delivery-card{transform:translateY(32px) rotate(-7deg);transition:transform .95s cubic-bezier(.22,1,.36,1) .46s,opacity .24s .44s}
.opening .parcel-illustration__delivery-card{transform:translateY(-74px) rotate(-4deg)}
.opening .parcel-illustration__body{animation:package-unseal 1.5s cubic-bezier(.2,.7,.2,1) both}

ustration__sparkle\" style=\"--sparkle-x:-0.55px;--sparkle-y:72.8px;--sparkle-delay:0.11s\"><path d=\"M0 -1 .24 -.24 1 0 .24 .24 0 1 -.24 .24 -1 0 -.24 -.24Z\" transform=\"scale(12)\" fill=\"#C99B35\" /></g></g><g transform=\"translate(216 55)\"><g class=\"parcel-illustration__sparkle\" style=\"--sparkle-x:-36.300000000000004px;--sparkle-y:59.49999999999999px;--sparkle-delay:0s\"><path d=\"M0 -1 .24 -.24 1 0 .24 .24 0 1 -.24 .24 -1 0 -.24 -.24Z\" transform=\"scale(9)\" fill=\"#B594BE\" /></g></g><g transform=\"translate(261 96)\"><g class=\"parcel-illustration__sparkle\" style=\"--sparkle-x:-61.050000000000004px;--sparkle-y:30.799999999999997px;--sparkle-delay:0.055s\"><path d=\"M0 -1 .24 -.24 1 0 .24 .24 0 1 -.24 .24 -1 0 -.24 -.24Z\" transform=\"scale(12.5)\" fill=\"#D6AE48\" /></g></g><g transform=\"translate(233 145)\"><g class=\"parcel-illustration__sparkle\" style=\"--sparkle-x:-45.650000000000006px;--sparkle-y:-3.5px;--sparkle-delay:0.11s\"><path d=\"M0 -1 .24 -.24 1 0 .24 .24 0 1 -.24 .24 -1 0 -.24 -.24Z\" transform=\"scale(6.5)\" fill=\"#C99B35\" /></g></g></g></g></svg>";

function circle(){const state=document.querySelector('#circle-state').value;return head('Friends',false)+`<div class="content">${own()}${state==='empty'?`<div class="empty-circle"><div class="start-art">${stamp('A','blue')}${stamp('friends','lilac',true)}</div><h4>A circle starts with two.</h4><p></p></div><div class="action-stack"><button class="primary" data-action="invite">Invite your first friend</button></div>`:`<div class="section-row"><h4>Your circle <span class="quiet">3</span></h4><button class="invite-trigger" data-action="invite">${svg("plus")}Invite a friend</button></div>${state==='new'?`<div class="new-friend green">${stamp('M','green')}<span><strong>Mila is in your circle.</strong></span></div>`:''}<div class="friends-stack">${Object.keys(people).map(friend).join('')}</div>`}</div>`+nav()}
// Stamp appearance, labels, ordering, and bubble behavior mirror the current Passport.
const passportStampCatalog=[{"title": "First arrival", "explanation": "Your first delivered parcel earns this stamp. A small beginning for your passport.", "icon": "parcel", "tone": "green", "total": 1, "numeral": "10"}, {"title": "Double digits", "explanation": "Ten delivered parcels in your collection. Archived arrivals count too.", "icon": "stamp", "tone": "lilac", "total": 10, "numeral": "10"}, {"title": "Well connected", "explanation": "Track parcels with three different carriers to earn this stamp.", "icon": "globe", "tone": "blue", "total": 3, "numeral": "10"}, {"title": "Express arrival", "explanation": "A parcel delivered within 48 hours of its first acceptance or transit scan earns this stamp.", "icon": "express", "tone": "peach", "total": 1, "numeral": "10"}, {"title": "Across borders", "explanation": "A delivered parcel with physical tracking scans in two different countries.", "icon": "border", "tone": "blue", "total": 1, "numeral": "10"}, {"title": "Around the world", "explanation": "Parcels first scanned in five different countries. Only countries explicitly named in the first acceptance or transit scan count.", "icon": "worldMap", "tone": "green", "total": 5, "numeral": "10"}, {"title": "The regular", "explanation": "25 delivered parcels. Archived deliveries count too.", "icon": "stamp", "tone": "lilac", "total": 25, "numeral": "25"}, {"title": "Right next door", "explanation": "A delivery whose first acceptance or transit scan and delivery scan name the same country.", "icon": "houses", "tone": "green", "total": 1, "numeral": "10"}, {"title": "Worth the wait", "explanation": "A parcel delivered more than 30 days after its first acceptance or transit scan.", "icon": "hourglass", "tone": "ochre", "total": 1, "numeral": "10"}, {"title": "A busy doorstep", "explanation": "Three parcels delivered on the same calendar day, using your device’s time zone.", "icon": "parcels", "tone": "peach", "total": 3, "numeral": "10"}, {"title": "Picked up", "explanation": "A parcel delivered after the carrier marked it ready for collection.", "icon": "storefront", "tone": "blue", "total": 1, "numeral": "10"}, {"title": "Home for the holidays", "explanation": "A parcel delivered in December, using your device’s local date.", "icon": "gift", "tone": "green", "total": 1, "numeral": "10"}];
const passportStampCounts={"mila": [12, 12, 3, 1, 0, 2, 12, 0, 0, 1, 0, 0], "noe": [6, 6, 1, 1, 0, 1, 6, 0, 0, 1, 0, 0]};
const passportStampPaths={"parcel": "M3 7l9-5 9 5v10l-9 5-9-5V7Zm0 0 9 5 9-5M12 12v10M7.5 4.5l9 5", "stamp": "M4 3h16v18H4V3Zm3 3h10v12H7V6Zm3 4 2 3 3-5", "globe": "M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0ZM3 12h18M12 3c5 5 5 13 0 18-5-5-5-13 0-18Z", "express": "m13 2-9 12h7l-1 8L21 9h-8l1-7", "border": "M20 12a8 8 0 1 1-8-8M4 12h9M12 4c-4 4-4 12 0 16M12 20c2-2 3-4 3-7M15 4h6v6m-7 1 7-7", "worldMap": "m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2V5Zm6-2v16m6-14v16M5 9l2 2m4-2 2 4m4-5 2 2", "houses": "m2 10 5-4 5 4v10H3V10m9-5 5-4 5 4v11h-7M6 20v-6h3v6m7-9V8h3v3", "hourglass": "M6 3h12M6 21h12M7 3v4l5 5-5 5v4m10-18v4l-5 5 5 5v4M9 18h6", "parcels": "m7 5 5-3 5 3v6l-5 3-5-3V5m0 0 5 3 5-3m-5 3v6M2 14l5-3 5 3v6l-5 3-5-3v-6m0 0 5 3 5-3m-5 3v6m5-9 5-3 5 3v6l-5 3-5-3m0-6 5 3 5-3m-5 3v6", "storefront": "M3 10h18l-2-7H5l-2 7Zm2 0v11h14V10M9 21v-7h6v7M8 3l-1 7m9-7 1 7", "gift": "M3 9h18v4H3V9Zm2 4v8h14v-8M12 9v12m0-12C3 9 5 1 9 4l3 5Zm0 0c9 0 7-8 3-5l-3 5Z"};
let showAllPassportStamps=false;
function passportStamps(){const person=document.querySelector('#person').value;const counts=passportStampCounts[person];if(!counts)return '';let upcoming=0;const visible=passportStampCatalog.map((item,i)=>({...item,index:i,count:counts[i],earned:counts[i]>=item.total})).filter(item=>showAllPassportStamps||item.earned||upcoming++<3);const progress=item=>item.icon==='express'?"Within 48 hours":`${Math.min(item.count,item.total)} / ${item.total}`;
return `<section class="passport-stamps" aria-labelledby="friend-stamps-title"><div class="section-row"><h4 id="friend-stamps-title">Stamps</h4></div><div class="passport-stamps__grid" id="friend-stamp-grid">${visible.map(item=>{const id=`friend-stamp-${item.index}`;return `<div><button type="button" class="stamp-card tone-${item.tone}${item.earned?' stamp-card--earned':''}" aria-label="${esc(item.title+(item.earned?'':', '+progress(item)))}" popovertarget="${id}" aria-haspopup="dialog" aria-expanded="false" aria-controls="${id}"><span class="passport-seal${item.earned?'':' passport-seal--locked'}" aria-hidden="true"><span class="passport-seal__frame">${item.icon==='stamp'?`<span class="passport-seal__ten">${item.numeral}</span>`:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${passportStampPaths[item.icon]}"/></svg>`}</span></span><span>${esc(item.title)}</span></button></div>`}).join('')}</div>${passportStampCatalog.length>visible.length||showAllPassportStamps?`<button class="passport-collection-toggle" data-action="toggle-passport-stamps" aria-expanded="${showAllPassportStamps}" aria-controls="friend-stamp-grid">${showAllPassportStamps?"Show less":"All stamps"}</button>`:''}${visible.map(item=>`<div id="friend-stamp-${item.index}" class="passport-bubble" popover="auto" role="dialog" aria-labelledby="friend-stamp-${item.index}-title" tabindex="-1"><h3 id="friend-stamp-${item.index}-title">${esc(item.title)}</h3><p>${esc(item.explanation+(item.earned?'':'\n'+progress(item)))}</p></div>`).join('')}</section>`}
document.addEventListener('toggle',event=>{const bubble=event.target;if(!bubble.matches('.passport-bubble'))return;const anchor=document.querySelector(`[popovertarget="${bubble.id}"]`);const open=bubble.matches(':popover-open');anchor?.setAttribute('aria-expanded',String(open));if(!open){delete bubble.dataset.positioned;return}if(!anchor){bubble.hidePopover();return}const rect=anchor.getBoundingClientRect(),{width,height}=bubble.getBoundingClientRect();const below=rect.bottom+10,top=below+height<=innerHeight-12?below:rect.top-height-10;bubble.style.left=`${Math.max(12,Math.min(innerWidth-width-12,rect.left+rect.width/2-width/2))}px`;bubble.style.top=`${Math.max(12,Math.min(innerHeight-height-12,top))}px`;bubble.dataset.positioned='true';bubble.focus({preventScroll:true})},true);
function dismissPassportBubble(event){document.querySelectorAll('.passport-bubble:popover-open').forEach(bubble=>{if(!(event.target instanceof Node&&bubble.contains(event.target)))bubble.hidePopover()})}
window.addEventListener('resize',dismissPassportBubble);window.addEventListener('scroll',dismissPassportBubble,true);

function profile(){const p=people[document.querySelector('#person').value];return head('Passport')+`<div class="content"><div class="profile-hero ${p.tone}"><div><h4 class="person-title">${p.name}</h4>${p.arrival?'<span class="arrival">A delivery this week</span>':''}</div>${stamp(p.name[0],p.tone)}</div>${p.count===null?`<div class="tiny-list"><p>${svg("lock")} Stats & arrivals private</p></div>`:`<div class="metric-grid"><div class="metric"><strong>${p.count}</strong><span>Deliveries</span></div><div class="metric"><strong>${p.average} days</strong><span>Average journey</span></div></div>${passportStamps()}`}<details class="profile-manage"><summary>Manage friendship</summary><button class="danger" data-action="remove">Remove ${p.name}</button></details></div>`}
function senderParcel(scope){const name=nickname||'Alex';const doc=new DOMParser().parseFromString(parcelArtwork,'image/svg+xml');const card=doc.querySelector('.parcel-illustration__delivery-card');const label=card.querySelectorAll('text')[1];label.textContent=name;label.setAttribute('font-size',String(Math.max(8,Math.min(17,95/name.length))));if(name.length>11){label.setAttribute('textLength','65');label.setAttribute('lengthAdjust','spacingAndGlyphs')}
const monogram=(target,x,y,size)=>{if(!target)return;const text=doc.createElementNS('http://www.w3.org/2000/svg','text');text.textContent=name[0].toUpperCase();for(const [key,value] of Object.entries({x,y,'font-size':size,'text-anchor':'middle','font-family':'-apple-system,BlinkMacSystemFont,sans-serif',fill:'#79608f'}))text.setAttribute(key,String(value));target.replaceWith(text)};
monogram(card.querySelector('path[d="M169 141v-11l5 6 5-6v11"]'),174,140,12);monogram(doc.querySelector('g[transform="translate(183 234) rotate(-27)"] path'),0,5,15);
return new XMLSerializer().serializeToString(doc.documentElement).replaceAll('id="parcel-','id="'+scope+'-parcel-').replaceAll('url(#parcel-','url(#'+scope+'-parcel-')}
function playInviteParcel(button){if(!button||button.disabled)return;button.disabled=true;button.classList.remove('opening');button.classList.add('resetting');void button.offsetWidth;requestAnimationFrame(()=>requestAnimationFrame(()=>{if(!button.isConnected)return;button.classList.remove('resetting');button.classList.add('opening');setTimeout(()=>{if(button.isConnected)button.disabled=false},matchMedia('(prefers-reduced-motion: reduce)').matches?80:1650)}))}
function invitationPanel(preview=false){return `<div class="invite-dialog-content"><div class="invite-dialog-head"><div><h2 id="${preview?'preview-invite-title':'invite-title'}">Invite a friend</h2><p>One use · valid for 7 days</p></div><button class="icon-btn" data-action="${preview?'close-invite-preview':'close-invite'}" aria-label="Close invitation dialog">${svg('close')}</button></div><div class="invite-mini-card invite-parcel-card green"><span class="invite-sender">From <strong>${esc(nickname||'Alex')}</strong></span><button class="package-open invite-package" data-action="replay-invite-parcel" aria-label="Replay package opening" title="Replay package opening"><span class="package-art">${senderParcel(preview?'preview':'dialog')}</span></button></div><input class="invitation-url" aria-label="Invitation link" readonly value="https://delivery.example/i/7kP2mQ"><div class="invite-dialog-actions"><button class="primary" data-action="share">${svg('share')}Share invitation</button><button class="copy-invite" data-action="copy">${svg('copy')}Copy link</button></div><p class="invite-feedback" role="status" aria-live="polite"></p><details class="invite-link-options"><summary>Manage links</summary><button class="danger" data-action="cancel-link">Cancel this link</button><button class="danger" data-action="cancel-previous">Cancel 3 previous links</button></details></div>`}
function invite(){return `<div class="invite-scene"><div class="invite-scene-background" inert aria-hidden="true">${circle()}</div><div class="invite-scene-shade"></div><section class="invite-panel" aria-labelledby="preview-invite-title">${invitationPanel(true)}</section></div>`}
function openInvite(){const dialog=document.querySelector('#invite-dialog');dialog.innerHTML=invitationPanel();dialog.showModal();playInviteParcel(dialog.querySelector(".invite-package"))}
function inviteFeedback(button,message){button.closest('.invite-dialog-content').querySelector('.invite-feedback').textContent=message}

function previewDetails(){return `<span class="preview-numbers">${stats?'18 deliveries · 2.4 days average · 3 stamps':'Stats & stamps private'}</span><span class="preview-arrival ${arrivals?'':'is-absent'}" ${arrivals?'':'aria-hidden="true"'}>A delivery this week</span>`}
function compactPreview(){return `<div class="compact-preview blue"><div class="preview-head"><strong data-preview-name>${esc(nickname||'Your name')}</strong>${stamp(nickname[0]||'A','blue')}</div><div class="preview-meta" data-preview-stats>${previewDetails()}</div></div>`}

function accept(){const opened=document.querySelector('#invitation-state').value==='opened';return head(opened?'An invitation':'For you',false,`<button class="icon-btn" data-go="circle" aria-label="Close invitation">${svg('close')}</button>`)+`<div class="content ${opened?'invitation-revealed':'package-content'}">${opened?`<div class="profile-hero lilac invitation-person"><div><p class="eyebrow">From</p><h4 class="person-title" tabindex="-1" data-reveal-title>Mila</h4></div>${stamp('M','lilac')}</div><div class="section-row"><h4>Your sharing</h4><button class="text-link" data-action="edit-invitation-sharing">Edit</button></div>${compactPreview()}${privacy()}<div class="action-stack"><button class="primary" data-action="accept">Accept invitation</button><button class="link-button" data-go="circle">Not now</button></div>`:`<div class="package-intro"><p class="eyebrow">A delivery from</p><h4>Mila</h4></div><button class="package-open" data-action="unwrap" aria-label="Tap to open your parcel"><span class="package-art">${parcelArtwork}</span><span class="package-hint">Tap to open your parcel <span aria-hidden="true">↗</span></span></button>`}</div>`}

function sharing(){return head(creating?'Create your profile':'Your sharing')+`<div class="content"><label class="form-label" for="sharing-name">Nickname</label><input class="name-input" id="sharing-name" maxlength="24" value="${esc(nickname)}" autocomplete="off"><p class="form-label" style="margin-top:17px">Visible to friends</p>${compactPreview()}<div class="switches"><label class="switch-row"><span><strong>Stats & stamps</strong><small>Deliveries, average days & stamps</small></span><input type="checkbox" role="switch" aria-label="Share stats and stamps" data-switch="stats" ${stats?'checked':''}></label><label class="switch-row"><span><strong>Arrivals this week</strong></span><input type="checkbox" role="switch" aria-label="Share arrivals this week" data-switch="arrivals" ${arrivals?'checked':''}></label></div>${privacy()}<div class="action-stack"><button class="primary" data-action="save" ${nickname.trim()?'':'disabled'}>${creating?'Create profile':'Save changes'}</button></div></div>`}
function start(){return head('Friends',false)+`<div class="content getting-started center"><div class="start-art">${stamp('A','blue')}${stamp('M','lilac')}</div><h4 class="start-title">Friends.</h4><p class="paragraph">Share stamps and delivery milestones with friends.</p><div class="action-stack"><button class="primary" data-action="create">Create your profile</button></div></div>`+nav()}
const screens=[['circle','Your circle',circle,'Invite a friend sits beside Your circle. Tap it to open the dialog.'],['profile','Friend’s Passport',profile,'The same stamp collection and tap bubbles as Passport.'],['invite','The invite dialog',invite,'A small dialog over your circle. Share or copy, then close.'],['accept','Accept an invitation',accept,'Tap the parcel. The invitation is inside.'],['sharing','Your sharing',sharing,'Two choices and a live preview.'],['start','Getting started',start,'One introduction. One next step.']];
function render(){clearTimeout(openingTimer);document.querySelector('#gallery').innerHTML=screens.map(([key,title,fn,caption],i)=>`<section class="study" data-screen="${key}"><h2 class="study-label"><span>0${i+1}</span>${title}</h2><div class="window">${fn()}</div><p class="caption">${caption}</p></section>`).join('');filter();playInviteParcel(document.querySelector('[data-screen="invite"] .invite-package'))}
function filter(){const value=document.querySelector('#screen').value;document.body.classList.toggle('focus',value!=='all');document.querySelectorAll('[data-screen]').forEach(section=>section.hidden=value!=='all'&&section.dataset.screen!==value)}
function go(screen){document.querySelector('#screen').value=screen;filter();window.scrollTo({top:0,behavior:'instant'})}
function toast(text){clearTimeout(toastTimer);const node=document.querySelector('#feedback');node.textContent=text;node.hidden=false;toastTimer=setTimeout(()=>node.hidden=true,3500)}
function modal(title,copy,action='close',label='Got it'){document.querySelector('#dialog-title').textContent=title;document.querySelector('#dialog-copy').textContent=copy;document.querySelector('#dialog-actions').innerHTML=`<button class="primary" data-confirm="${action}">${label}</button>${action!=='close'?'<button class="secondary" data-confirm="close">Cancel</button>':''}`;document.querySelector('#dialog').showModal()}
document.querySelector('#invite-dialog').addEventListener('click',event=>{if(event.target!==event.currentTarget)return;const r=event.currentTarget.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)event.currentTarget.close()});
document.addEventListener('focusin',event=>{if(event.target.matches('.invitation-url'))event.target.select()});
document.querySelector('#dialog').setAttribute('aria-labelledby','dialog-title');
document.querySelector('#screen').addEventListener('change',filter);document.querySelector('#invitation-state').addEventListener('change',render);document.querySelector('#circle-state').addEventListener('change',render);document.querySelector('#person').addEventListener('change',()=>{showAllPassportStamps=false;render()});
document.querySelector('.theme').addEventListener('click',event=>{const dark=document.body.classList.toggle('dark');event.currentTarget.textContent=dark?'Light mode':'Dark mode';event.currentTarget.setAttribute('aria-pressed',String(dark))});
document.addEventListener('pointermove',event=>{const button=event.target.closest('.package-open');if(!button||button.disabled||event.pointerType==='touch'||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const rect=button.getBoundingClientRect();button.style.setProperty('--tilt-x',`${((event.clientX-rect.left)/rect.width-.5)*8}deg`);button.style.setProperty('--tilt-y',`${((event.clientY-rect.top)/rect.height-.5)*-5}deg`)});
document.addEventListener('pointerout',event=>{const button=event.target.closest('.package-open');if(button&&!button.contains(event.relatedTarget)){button.style.removeProperty('--tilt-x');button.style.removeProperty('--tilt-y')}});
document.addEventListener('input',event=>{if(event.target.id==='sharing-name'){nickname=event.target.value;document.querySelectorAll('[data-preview-name]').forEach(node=>node.textContent=nickname||'Your name');document.querySelector('[data-action="save"]').disabled=!nickname.trim()}});
document.addEventListener('change',event=>{if(event.target.dataset.switch){if(event.target.dataset.switch==='stats')stats=event.target.checked;else arrivals=event.target.checked;document.querySelectorAll('[data-preview-stats]').forEach(node=>node.innerHTML=previewDetails())}});
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.go){if(button.dataset.go==='sharing')sharingReturn='circle';go(button.dataset.go);return}if(button.dataset.person){showAllPassportStamps=false;document.querySelector('#person').value=button.dataset.person;render();go('profile');return}if(button.dataset.info){modal('Another screen',button.dataset.info);return}if(button.dataset.confirm){document.querySelector('#dialog').close();if(button.dataset.confirm!=='close'){toast('Preview only — no friendships, sharing, or links changed.');go('circle')}return}switch(button.dataset.action){case'toggle-passport-stamps':showAllPassportStamps=!showAllPassportStamps;document.querySelector('[data-screen="profile"] .window').innerHTML=profile();document.querySelector('[data-action="toggle-passport-stamps"]').focus({preventScroll:true});break;case'replay-invite-parcel':playInviteParcel(button);break;case'invite':openInvite();break;case'close-invite':document.querySelector('#invite-dialog').close();break;case'close-invite-preview':go('circle');break;case'cancel-link':inviteFeedback(button,'Preview only — this link would be cancelled.');break;case'cancel-previous':inviteFeedback(button,'Preview only — your 3 previous links would be cancelled.');break;case'edit-invitation-sharing':sharingReturn='accept';go('sharing');break;case'unwrap':{if(button.disabled)break;button.disabled=true;button.classList.add('opening');const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;openingTimer=setTimeout(()=>{document.querySelector('#invitation-state').value='opened';render();document.querySelector('[data-reveal-title]')?.focus({preventScroll:true})},reduced?80:1650);break}case'create':sharingReturn='circle';creating=true;nickname='';stats=true;arrivals=true;render();go('sharing');document.querySelector('#sharing-name').focus();break;case'save':nickname=nickname.trim();if(creating){document.querySelector('#circle-state').value='empty';creating=false}render();go(sharingReturn);toast('Sharing saved in this preview.');break;case'accept':document.querySelector('#circle-state').value='new';render();go('circle');toast('Preview: Mila joined your circle.');break;case'share':inviteFeedback(button,'Preview: opens your device’s share sheet.');break;case'copy':inviteFeedback(button,'Preview only — no link copied.');break;case'revoke':modal('Cancel previous links?','Previously created invitation links would stop working. The invitation shown here stays available.','revoke','Cancel previous links');break;case'remove':modal('Remove this friend?','You would stop seeing each other’s shared Passport. You can reconnect with a new invitation.','remove','Remove friend');break;case'disable':modal('Turn off Friends?','Your shared profile and friendships would be removed. Your parcels stay in your account.','disable','Turn off Friends');break}});
render();
</script></body></html>
