.parcel-illustration { display: block; width: 100%; overflow: visible; }
.parcel-illustration__body { transform-origin: 150px 210px;  }
.parcel-illustration__shadow { transform-origin: 150px 286px;  }
.parcel-illustration__flap { transform-origin: 0 0; transform: scaleY(1) skewX(0deg); transition: transform .72s var(--spring) .17s, opacity .3s .1s; }
.parcel-illustration__flap--rear { transition-duration: .62s, .3s; transition-delay: .07s, .05s; }
.parcel-illustration__flap--hidden { opacity: 0; }
.parcel-illustration__tape { transform-origin: 103px 119px; transition: opacity .22s .05s, transform .4s var(--ease-out); }
.parcel-illustration__delivery-card { opacity: 0; transform: translateY(22px) rotate(-11deg); transform-origin: 151px 174px; transition: transform .86s var(--spring) .25s, opacity .25s .23s; }
.parcel-illustration__check { stroke-dasharray: 25; stroke-dashoffset: 25; transition: stroke-dashoffset .38s ease-out .6s; }
.parcel-illustration__face-light { opacity: calc(.025 + (var(--parcel-x, 0) + 1) * .045); }
.parcel-illustration__edge { opacity: calc(.22 + (var(--parcel-x, 0) + 1) * .18); }
.parcel-illustration__seal-light { opacity: calc(.2 + (var(--parcel-y, 0) + 1) * .28); }
.parcel-illustration__glints, .parcel-illustration__light { opacity: 0; pointer-events: none; }
.parcel-illustration__sparkle { opacity: 0; transform-box: fill-box; transform-origin: center; }
.parcel-illustration__light { filter: blur(10px); }

.opening .parcel-illustration__flap { transform: scaleY(var(--fold-scale)) skewX(var(--fold-skew)); opacity: 1; }
.opening .parcel-illustration__tape { opacity: 0; transform: translate(-6px, -19px) rotate(-8deg); }
.opening .parcel-illustration__delivery-card { opacity: 1; transform: translateY(-69px) rotate(-5deg); }
.opening .parcel-illustration__check { stroke-dashoffset: 0; }
.icon-btn,.bottom-nav{background:var(--control)}.album button,.name-input{background:var(--paper)}

</main><dialog id="dialog"><h2 id="dialog-title"></h2><p id="dialog-copy"></p><div id="dialog-actions"></div></dialog><div id="feedback" role="status" hidden></div>
<script>
const paths={back:'m15 5-7 7 7 7',close:'m6 6 12 12M6 18 18 6',plus:'M12 5v14M5 12h14',settings:'M4 7h16M4 17h16M9 4v6m6 4v6',chevron:'m9 5 7 7-7 7',parcel:'m3 7 9-5 9 5v10l-9 5-9-5V7Zm0 0 9 5 9-5M12 12v10M7.5 4.5l9 5',passport:'M6 3h13v18H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Zm0 0v18M10 10a3 3 0 1 0 6 0 3 3 0 0 0-6 0Zm0 7h6',friends:'M10 7a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm10 1a3 3 0 1 1-6 0 3 3 0 0 1 6 0ZM2 21v-3a5 5 0 0 1 10 0v3m2-7a5 5 0 0 1 8 4v3',lock:'M5 10h14v11H5V10Zm3 0V7a4 4 0 0 1 8 0v3M12 14v3',bolt:'m13 2-9 12h7l-1 8L21 9h-8l1-7',check:'m5 12 4 4L19 6',ten:'M4 7h3v11M13 7h6v11h-6z'};
const people={mila:{name:'Mila',tone:'lilac',count:12,average:3,stamps:4,arrival:true},noe:{name:'Noé',tone:'peach',count:6,average:4,stamps:2,arrival:null},sam:{name:'Sam',tone:'green',count:null,average:null,stamps:null,arrival:null}};
let nickname='Alex',stats=true,arrivals=false,creating=false,sharingReturn='circle',openingTimer,toastTimer;
// Static rendering of the app’s existing ParcelIllustration; keep the familiar package.
const parcelArtwork="<svg class=\"parcel-illustration \" viewBox=\"0 0 300 310\" fill=\"none\" aria-hidden=\"true\"><ellipse class=\"parcel-illustration__shadow\" cx=\"150\" cy=\"286\" rx=\"84\" ry=\"10\" fill=\"currentColor\" opacity=\".08\"></ellipse><g class=\"parcel-illustration__body\"><path d=\"m55 142 95-47 95 47-95 48-95-48Z\" fill=\"#806345\"></path><g transform=\"translate(55 142) rotate(-26.323298)\"><g class=\"parcel-illustration__flap parcel-illustration__flap--rear parcel-illustration__flap--hidden\" style=\"--fold-scale:-0.970652;--fold-skew:-24.57453deg\"><polygon points=\"0,0 105.990566,0 120.5579,60.760125 14.567334,60.760125\" fill=\"#C4A078\" stroke=\"#987450\" stroke-opacity=\".24\" stroke-width=\".7\"></polygon></g></g><g transform=\"translate(150 95) rotate(26.323298)\"><g class=\"parcel-illustration__flap parcel-illustration__flap--rear\" style=\"--fold-scale:-1.39723;--fold-skew:35.523262deg\"><polygon points=\"0,0 105.990566,0 74.058478,42.574544 -32.153805,42.126391\" fill=\"#D8B997\" stroke=\"#987450\" stroke-opacity=\".24\" stroke-width=\".7\"></polygon></g></g><ellipse class=\"parcel-illustration__light\" cx=\"150\" cy=\"140\" rx=\"62\" ry=\"20\" fill=\"#FFE8AE\"></ellipse><g class=\"parcel-illustration__delivery-card\"><rect x=\"110\" y=\"111\" width=\"83\" height=\"111\" rx=\"7\" fill=\"#FCFAF4\" stroke=\"#E6E0D4\" stroke-width=\".7\"></rect><path d=\"M112 120v-2a5 5 0 0 1 5-5h69\" stroke=\"white\" stroke-width=\"1.5\" stroke-linecap=\"round\"></path><circle cx=\"143\" cy=\"145\" r=\"19\" fill=\"#E7ECE4\"></circle><path class=\"parcel-illustration__check\" d=\"m135 145 5 5 11-12\" stroke=\"#587260\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path><path d=\"M124 181h45\" stroke=\"#DAD7CE\" stroke-width=\"4\" stroke-linecap=\"round\"></path><path d=\"M124 194h29\" stroke=\"#E7E4DC\" stroke-width=\"4\" stroke-linecap=\"round\"></path></g><path d=\"m55 142 95 48v87l-95-48v-87Z\" fill=\"#C9A47B\"></path><path d=\"m150 190 95-48v87l-95 48v-87Z\" fill=\"#B78F66\"></path><path class=\"parcel-illustration__face-light\" d=\"m55 142 95 48v87l-95-48v-87Z\" fill=\"#FFF4D6\"></path><path d=\"M56 144v84l93 47m2 0 92-46v-84\" stroke=\"#987450\" stroke-opacity=\".25\" stroke-width=\".8\"></path><path class=\"parcel-illustration__edge\" d=\"m55 142 95 48 95-48m-95 48v87\" stroke=\"#FFF2CF\" stroke-width=\"1\"></path><g transform=\"translate(77 193) rotate(27)\"><rect width=\"51\" height=\"32\" rx=\"3\" fill=\"#D8E5EA\"></rect><path d=\"M8 8v17m4-17v17m3-17v17m5-17v17m3-17v17m5-17v17m4-17v17m3-17v17m5-17v17\" stroke=\"#4E677A\" stroke-width=\"1.5\"></path><path d=\"M3 5V3h45\" stroke=\"white\" stroke-opacity=\".5\"></path></g><g transform=\"translate(201 201) rotate(-27)\"><path d=\"M10 22V4m-5 5 5-5 5 5\" stroke=\"#735C43\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></g><g transform=\"translate(183 234) rotate(-27)\"><circle r=\"14\" fill=\"#DECCE2\"></circle><circle class=\"parcel-illustration__seal-light\" r=\"11.5\" stroke=\"#FFF6FF\" stroke-width=\"1.2\"></circle><path d=\"M0-7V7m-6-10 12 6M-6 3 6-3\" stroke=\"#7C6787\" stroke-width=\"2\" stroke-linecap=\"round\"></path></g><g transform=\"translate(245 142) rotate(153.194212)\"><g class=\"parcel-illustration__flap parcel-illustration__flap--hidden\" style=\"--fold-scale:-0.867747;--fold-skew:-24.462605deg\"><polygon points=\"0,0 106.437775,0 120.492936,60.880641 14.506128,59.988101\" fill=\"#D1AE85\" stroke=\"#987450\" stroke-opacity=\".24\" stroke-width=\".7\"></polygon></g></g><g transform=\"translate(55 142) rotate(26.805788)\"><g class=\"parcel-illustration__flap\" style=\"--fold-scale:-1.22193;--fold-skew:41.281856deg\"><polygon points=\"0,0 106.437775,0 138.010213,-42.841933 31.797921,-42.395663\" fill=\"#DDBD96\" stroke=\"#987450\" stroke-opacity=\".24\" stroke-width=\".7\"></polygon></g></g><g class=\"parcel-illustration__tape\"><path d=\"m96 122 13-7 95 48-13 7-95-48Z\" fill=\"#EBDDCA\"></path><path d=\"m103 119 94 47\" stroke=\"#AF9474\" stroke-opacity=\".6\" stroke-width=\"1\" stroke-dasharray=\"3 3\"></path></g><g class=\"parcel-illustration__glints\"><g transform=\"translate(43 96)\"><g class=\"parcel-illustration__sparkle\" style=\"--sparkle-x:58.85px;--sparkle-y:30.799999999999997px;--sparkle-delay:0s\"><path d=\"M0 -1 .24 -.24 1 0 .24 .24 0 1 -.24 .24 -1 0 -.24 -.24Z\" transform=\"scale(11.5)\" fill=\"#C99B35\"></path></g></g><g transform=\"translate(91 57)\"><g class=\"parcel-illustration__sparkle\" style=\"--sparkle-x:32.45px;--sparkle-y:58.099999999999994px;--sparkle-delay:0.055s\"><path d=\"M0 -1 .24 -.24 1 0 .24 .24 0 1 -.24 .24 -1 0 -.24 -.24Z\" transform=\"scale(8)\" fill=\"#D6AE48\"></path></g></g><g transform=\"translate(151 36)\"><g class=\"parcel-illustration__sparkle\" style=\"--sparkle-x:-0.55px;--sparkle-y:72.8px;--sparkle-delay:0.11s\"><path d=\"M0 -1 .24 -.24 1 0 .24 .24 0 1 -.24 .24 -1 0 -.24 -.24Z\" transform=\"scale(12)\" fill=\"#C99B35\"></path></g></g><g transform=\"translate(216 55)\"><g class=\"parcel-illustration__sparkle\" style=\"--sparkle-x:-36.300000000000004px;--sparkle-y:59.49999999999999px;--sparkle-delay:0s\"><path d=\"M0 -1 .24 -.24 1 0 .24 .24 0 1 -.24 .24 -1 0 -.24 -.24Z\" transform=\"scale(9)\" fill=\"#B594BE\"></path></g></g><g transform=\"translate(261 96)\"><g class=\"parcel-illustration__sparkle\" style=\"--sparkle-x:-61.050000000000004px;--sparkle-y:30.799999999999997px;--sparkle-delay:0.055s\"><path d=\"M0 -1 .24 -.24 1 0 .24 .24 0 1 -.24 .24 -1 0 -.24 -.24Z\" transform=\"scale(12.5)\" fill=\"#D6AE48\"></path></g></g><g transform=\"translate(233 145)\"><g class=\"parcel-illustration__sparkle\" style=\"--sparkle-x:-45.650000000000006px;--sparkle-y:-3.5px;--sparkle-delay:0.11s\"><path d=\"M0 -1 .24 -.24 1 0 .24 .24 0 1 -.24 .24 -1 0 -.24 -.24Z\" transform=\"scale(6.5)\" fill=\"#C99B35\"></path></g></g></g></g></svg>";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svg=(name)=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.parcel}"/></svg>`;
const stamp=(letter,tone='blue',isIcon=false)=>`<span class="stamp ${tone}" aria-hidden="true"><span class="stamp-inner">${isIcon?svg(letter):esc(letter)}</span></span>`;
const privacy=()=>`<p class="privacy">${svg('lock')}<span>Your parcel details stay private.</span></p>`;
const nav=()=>`<nav class="bottom-nav" aria-label="App tabs"><button data-info="Deliveries stays as approved in the A + E exploration.">${svg('parcel')}Deliveries</button><button data-info="Your own Passport keeps its dedicated tab.">${svg('passport')}Passport</button><button class="active" data-go="circle">${svg('friends')}Friends</button></nav>`;
function head(title,back=true,right=''){return `<header class="screen-head">${back?`<button class="icon-btn" data-go="circle" aria-label="Back to Friends">${svg('back')}</button>`:'<span></span>'}<h3>${title}</h3>${right||'<span></span>'}</header>`}
function friend(key){const p=people[key];return `<button class="friend ${p.tone}" data-person="${key}">${stamp(p.name[0],p.tone)}<span class="friend-copy"><strong class="friend-name">${p.name}</strong><span class="friend-meta">${p.stamps===null?'Stats private':`${p.stamps} stamps`}</span>${p.arrival?'<span class="arrival">A delivery this week</span>':''}</span></button>`}
function own(){return `<button class="own-row" data-go="sharing">${stamp(nickname[0]||'A','blue')}<span class="own-copy"><strong>Your sharing</strong><small>${stats?'Stats & stamps shared':arrivals?'Weekly arrivals shared':'Sharing paused'}${stats&&arrivals?' · arrivals shared':''}</small></span>${svg('settings')}</button>`}
function circle(){const state=document.querySelector('#circle-state').value;return head('Friends',false,`<button class="icon-btn" data-go="invite" aria-label="Invite a friend">${svg('plus')}</button>`)+`<div class="content">${own()}${state==='empty'?`<div class="empty-circle"><div class="start-art">${stamp('A','blue')}${stamp('friends','lilac',true)}</div><h4>A circle starts with two.</h4><p></p></div><div class="action-stack"><button class="primary" data-go="invite">Invite your first friend</button><button class="link-button" data-action="enter-link">Have an invitation?</button></div>`:`<div class="section-row"><h4>Your circle <span class="quiet">3</span></h4></div>${state==='new'?`<div class="new-friend green">${stamp('M','green')}<span><strong>Mila is in your circle.</strong></span></div>`:''}<div class="friends-stack">${Object.keys(people).map(friend).join('')}</div><button class="link-button" data-action="enter-link">Have an invitation?</button>`}</div>`+nav()}
function profile(){const p=people[document.querySelector('#person').value];const titles=['First delivery','Ten deliveries','Connected','Express'];const icons=['parcel','ten','friends','bolt'];return head('Passport')+`<div class="content"><div class="profile-hero ${p.tone}"><div><h4 class="person-title">${p.name}</h4>${p.arrival?'<span class="arrival">A delivery this week</span>':''}</div>${stamp(p.name[0],p.tone)}</div>${p.count===null?`<div class="tiny-list"><p>${svg("lock")} Stats & arrivals private</p></div>`:`<div class="metric-grid"><div class="metric"><strong>${p.count}</strong><span>Deliveries</span></div><div class="metric"><strong>${p.average} days</strong><span>Average journey</span></div></div><div class="section-row"><h4>Stamps</h4><span class="quiet">${p.stamps}</span></div><div class="album">${titles.slice(0,p.stamps).map((title,i)=>`<button class="${p.tone}" data-stamp="${i}" aria-label="${title}" aria-pressed="false">${stamp(icons[i],p.tone,true)}</button>`).join('')}</div><p class="stamp-story" data-story hidden></p>`}<details class="profile-manage"><summary>Manage friendship</summary><button class="danger" data-action="remove">Remove ${p.name}</button></details></div>`}
function invite(){return head('Invite a friend')+`<div class="content"><div class="invitation-card green"><div class="invitation-top"><div><h4>A little company<br>along the way.</h4></div>${stamp('friends','green',true)}</div><p class="invitation-from">From ${esc(nickname)}</p><div class="card-rule"></div><span class="terms">One use · valid for 7 days</span></div><div class="action-stack"><button class="primary" data-action="share">Share invitation</button><button class="secondary" data-action="copy">Copy link</button></div><details class="profile-manage"><summary>Manage invitation links</summary><button class="danger" data-action="revoke">Cancel previous links</button></details></div>`}
function compactPreview(){return `<div class="compact-preview blue"><div class="preview-head"><strong data-preview-name>${esc(nickname||'Your name')}</strong>${stamp(nickname[0]||'A','blue')}</div><div class="preview-meta" data-preview-stats>${stats?'18 deliveries · 2.4 days average · 3 stamps':'Stats & stamps private'}${arrivals?'<br>A delivery this week':''}</div></div>`}
function accept(){const opened=document.querySelector('#invitation-state').value==='opened';return head(opened?'An invitation':'For you',false,`<button class="icon-btn" data-go="circle" aria-label="Close invitation">${svg('close')}</button>`)+`<div class="content ${opened?'invitation-revealed':'package-content'}">${opened?`<div class="profile-hero lilac invitation-person"><div><p class="eyebrow">From</p><h4 class="person-title" tabindex="-1" data-reveal-title>Mila</h4></div>${stamp('M','lilac')}</div><div class="section-row"><h4>Your sharing</h4><button class="text-link" data-action="edit-invitation-sharing">Edit</button></div>${compactPreview()}${privacy()}<div class="action-stack"><button class="primary" data-action="accept">Accept invitation</button><button class="link-button" data-go="circle">Not now</button></div>`:`<div class="package-intro"><p class="eyebrow">A delivery from</p><h4>Mila</h4></div><button class="package-open" data-action="unwrap" aria-label="Tap to open your parcel"><span class="package-art">${parcelArtwork}</span><span class="package-hint">Tap to open your parcel <span aria-hidden="true">↗</span></span></button>`}</div>`}

function sharing(){return head(creating?'Create your profile':'Your sharing')+`<div class="content"><label class="form-label" for="sharing-name">Nickname</label><input class="name-input" id="sharing-name" maxlength="24" value="${esc(nickname)}" autocomplete="off"><p class="form-label" style="margin-top:17px">Visible to friends</p>${compactPreview()}<div class="switches"><label class="switch-row"><span><strong>Stats & stamps</strong><small>Deliveries, average days & stamps</small></span><input type="checkbox" role="switch" aria-label="Share stats and stamps" data-switch="stats" ${stats?'checked':''}></label><label class="switch-row"><span><strong>Arrivals this week</strong></span><input type="checkbox" role="switch" aria-label="Share arrivals this week" data-switch="arrivals" ${arrivals?'checked':''}></label></div>${privacy()}<div class="action-stack"><button class="primary" data-action="save" ${nickname.trim()?'':'disabled'}>${creating?'Create profile':'Save changes'}</button></div><details class="profile-manage"><summary>More options</summary><button class="danger" data-action="disable">Turn off Friends</button></details></div>`}
function start(){return head('Friends',false)+`<div class="content getting-started center"><div class="start-art">${stamp('A','blue')}${stamp('M','lilac')}</div><h4 class="start-title">Your Passport,<br>with a little company.</h4><p class="paragraph">Share stamps and delivery milestones with friends.</p><div class="action-stack"><button class="primary" data-action="create">Create your profile</button><button class="link-button" data-action="enter-link">I have an invitation</button></div></div>`+nav()}
const screens=[['circle','Your circle',circle,'Names lead. One summary per friend.'],['profile','Friend’s Passport',profile,'The person, their stats, their stamps.'],['invite','Send an invitation',invite,'A postcard ready to send.'],['accept','Accept an invitation',accept,'Tap the parcel. The invitation is inside.'],['sharing','Your sharing',sharing,'Two choices and a live preview.'],['start','Getting started',start,'One introduction. One next step.']];
function render(){clearTimeout(openingTimer);document.querySelector('#gallery').innerHTML=screens.map(([key,title,fn,caption],i)=>`<section class="study" data-screen="${key}"><h2 class="study-label"><span>0${i+1}</span>${title}</h2><div class="window">${fn()}</div><p class="caption">${caption}</p></section>`).join('');filter()}
function filter(){const value=document.querySelector('#screen').value;document.body.classList.toggle('focus',value!=='all');document.querySelectorAll('[data-screen]').forEach(section=>section.hidden=value!=='all'&&section.dataset.screen!==value)}
function go(screen){document.querySelector('#screen').value=screen;filter();window.scrollTo({top:0,behavior:'instant'})}
function toast(text){clearTimeout(toastTimer);const node=document.querySelector('#feedback');node.textContent=text;node.hidden=false;toastTimer=setTimeout(()=>node.hidden=true,3500)}
function modal(title,copy,action='close',label='Got it'){document.querySelector('#dialog-title').textContent=title;document.querySelector('#dialog-copy').textContent=copy;document.querySelector('#dialog-actions').innerHTML=`<button class="primary" data-confirm="${action}">${label}</button>${action!=='close'?'<button class="secondary" data-confirm="close">Cancel</button>':''}`;document.querySelector('#dialog').showModal()}
document.querySelector('#dialog').setAttribute('aria-labelledby','dialog-title');
document.querySelector('#screen').addEventListener('change',filter);document.querySelector('#invitation-state').addEventListener('change',render);document.querySelector('#circle-state').addEventListener('change',render);document.querySelector('#person').addEventListener('change',render);
document.querySelector('.theme').addEventListener('click',event=>{const dark=document.body.classList.toggle('dark');event.currentTarget.textContent=dark?'Light mode':'Dark mode';event.currentTarget.setAttribute('aria-pressed',String(dark))});
document.addEventListener('input',event=>{if(event.target.id==='sharing-name'){nickname=event.target.value;document.querySelectorAll('[data-preview-name]').forEach(node=>node.textContent=nickname||'Your name');document.querySelector('[data-action="save"]').disabled=!nickname.trim()}});
document.addEventListener('change',event=>{if(event.target.dataset.switch){if(event.target.dataset.switch==='stats')stats=event.target.checked;else arrivals=event.target.checked;const focus=event.target.dataset.switch;render();document.querySelector(`[data-switch="${focus}"]`).focus()}});
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.go){if(button.dataset.go==='sharing')sharingReturn='circle';go(button.dataset.go);return}if(button.dataset.person){document.querySelector('#person').value=button.dataset.person;render();go('profile');return}if(button.dataset.info){modal('Another screen',button.dataset.info);return}if(button.dataset.stamp){const stories=[['First delivery','The first parcel that made it home.'],['Ten deliveries','A collection starts to take shape: ten completed deliveries.'],['Connected','A Passport shared with a friend.'],['Express','A parcel that arrived especially quickly.']];const [title,story]=stories[Number(button.dataset.stamp)];document.querySelectorAll('[data-stamp]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));button.closest('.content').querySelector('[data-story]').hidden=false;button.closest('.content').querySelector('[data-story]').innerHTML=`<strong>${title}</strong>${story}`;return}if(button.dataset.confirm){document.querySelector('#dialog').close();if(button.dataset.confirm!=='close'){toast('Preview only — no friendships, sharing, or links changed.');go('circle')}return}switch(button.dataset.action){case'edit-invitation-sharing':sharingReturn='accept';go('sharing');break;case'unwrap':{if(button.disabled)break;button.disabled=true;button.classList.add('opening');const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;openingTimer=setTimeout(()=>{document.querySelector('#invitation-state').value='opened';render();document.querySelector('[data-reveal-title]')?.focus({preventScroll:true})},reduced?80:1100);break}case'create':sharingReturn='circle';creating=true;nickname='';render();go('sharing');document.querySelector('#sharing-name').focus();break;case'save':nickname=nickname.trim();if(creating){document.querySelector('#circle-state').value='empty';creating=false}render();go(sharingReturn);toast('Sharing saved in this preview.');break;case'accept':document.querySelector('#circle-state').value='new';render();go('circle');toast('Preview: Mila joined your circle.');break;case'enter-link':document.querySelector('#invitation-state').value='sealed';render();go('accept');break;case'share':modal('Share invitation','This opens the device’s share sheet in the app. This prototype won’t send an invitation.');break;case'copy':toast('Preview only — no link copied.');break;case'revoke':modal('Cancel previous links?','Previously created invitation links would stop working. The invitation shown here stays available.','revoke','Cancel previous links');break;case'remove':modal('Remove this friend?','You would stop seeing each other’s shared Passport. You can reconnect with a new invitation.','remove','Remove friend');break;case'disable':modal('Turn off Friends?','Your shared profile and friendships would be removed. Your parcels stay in your account.','disable','Turn off Friends');break}});
render();
</script></body></html>
