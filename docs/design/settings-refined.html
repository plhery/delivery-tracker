r:var(--accent-ink);line-height:1.55;margin:0 0 16px}.delivery-card button{display:flex;align-items:center;justify-content:space-between;width:100%;font-size:11px;color:var(--accent-ink);border-top:1px solid color-mix(in srgb,var(--accent-ink) 14%,transparent);padding-top:11px}.delivery-card button svg{width:13px;height:13px}.appearance-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.appearance-option{border:1px solid var(--line);background:var(--paper);padding:9px 7px 7px;border-radius:11px;text-align:center;font-size:10px;color:var(--muted)}.appearance-option[aria-pressed=true]{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green);color:var(--ink)}.mini-screen{height:40px;max-width:61px;margin:0 auto 7px;border:1px solid #cfd4c5;background:#f2f4eb;border-radius:5px;padding:7px;display:grid;gap:4px;align-content:start}.mini-screen:before,.mini-screen:after{content:'';height:6px;border-radius:2px;background:#dce2d1}.mini-screen.dark{background:#30392d;border-color:#56624d}.mini-screen.dark:before,.mini-screen.dark:after{background:#69755c}.mini-screen.system{background:linear-gradient(90deg,#f2f4eb 50%,#30392d 50%)}.mini-screen.system:before,.mini-screen.system:after{background:linear-gradient(90deg,#dce2d1 50%,#69755c 50%)}.radio-option{width:100%;text-align:left;display:flex;align-items:start;gap:11px;padding:16px 14px;min-height:67px}.radio-option+.radio-option{border-top:1px solid var(--line)}.radio-circle{width:15px;height:15px;border:1px solid var(--muted);border-radius:50%;margin-top:2px;flex-shrink:0}[aria-checked=true]>.radio-circle{border:5px solid var(--green)}.radio-option strong{font-weight:500;font-size:13px;display:block}.radio-option small{font-size:11px;color:var(--muted);line-height:1.5;display:block;margin-top:4px}.times{display:flex;gap:12px;padding:0 14px 14px}.times label{font-size:10px;color:var(--muted);flex:1}.times input{width:100%;font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px;margin-top:5px}.select-row select{max-width:150px;margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:12px;padding:4px}.danger{color:var(--danger)}.subtle-button{display:block;padding:12px 2px;font-size:12px;color:var(--muted);text-align:left;width:100%}.preview-message{padding:12px 14px;background:var(--accent-soft);color:var(--accent-ink);border-radius:12px;font-size:12px;line-height:1.5;margin:15px 0}.primary{background:var(--accent);border-radius:12px;padding:12px;font-size:12px;width:100%;margin-top:15px;color:#39351d;font-weight:550}.preview-note{font-size:11px;line-height:1.6;color:var(--muted);margin-top:14px}.pick{border-top:1px solid var(--line);margin-top:30px;padding-top:19px;display:flex;justify-content:space-between;gap:24px;color:var(--muted);font-size:12px}.pick p{margin:0;max-width:640px;line-height:1.6}.pick strong{color:var(--ink);font-weight:600}.single .grid{grid-template-columns:minmax(0,390px);justify-content:center}.dark-canvas{color-scheme:dark;--page:#20261f;--surface:#262d24;--paper:#2e362b;--ink:#f0f2e8;--muted:#a2ac9a;--line:#3c4637;--wash:#323c2e;--accent:#dac250;--accent-soft:#49452a;--accent-ink:#e2d08d;--green:#97b084;--danger:#e6a297}

</style></head><body><main>
<header class="mast"><strong>Delivery Tracker <span class="refined-tag">/ Refined settings</span></strong><a href="settings-concepts.html">Previous directions ↗</a></header>
<div class="intro"><h1>Settings, refined.</h1><p>A’s clear groups, C’s visual appearance picker.<br>Everyday choices together; account actions one level deeper.</p></div>
<div class="toolbar"><button class="preview-theme" type="button" aria-pressed="false">Preview dark mode</button></div>
<div class="grid" id="previews"></div>
<footer class="pick"><p>Try the appearance picker, delivery preferences, and account screens. This preview won’t change your account.</p></footer>
</main><script>
const paths={chevron:'m9 5 7 7-7 7',back:'m15 5-7 7 7 7',bell:'M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4',moon:'M20 15a9 9 0 0 1-11-11A9 9 0 1 0 20 15Z',appearance:'M3 4h18v13H3zM8 21h8M12 17v4',language:'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0ZM3 12h18M12 3c5 5 5 13 0 18-5-5-5-13 0-18Z',lock:'M5 10h14v11H5zM8 10V7a4 4 0 0 1 8 0v3',account:'M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0ZM4 21v-2a8 8 0 0 1 16 0v2',download:'M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5'};
const svg=(name,cls='')=>`<svg viewBox="0 0 24 24" aria-hidden="true" class="${cls}"><path d="${paths[name]}"/></svg>`;

const state={appearance:'System',language:'English',notifications:true,preset:'Important only',quiet:true,start:'22:00',end:'08:00'};
const routes={mix:'home'};
const messages={};
function profile(){return '<div class="profile"><span class="avatar" aria-hidden="true">AM</span><div><strong>Alex Morgan</strong><small>alex@example.com</small></div></div>'}
function row(label,value,route,icon='',subtitle='',cls=''){return `<button class="row ${cls}" data-route="${route}">${icon?svg(icon,'row-icon'):''}<span class="row-copy"><strong>${label}</strong>${subtitle?`<small>${subtitle}</small>`:''}</span>${value?`<span class="value">${value}</span>`:''}${svg('chevron','chevron')}</button>`}
function toggle(label,key,detail=''){return `<button class="toggle-row" role="switch" aria-checked="${state[key]}" aria-label="${label}" data-toggle="${key}"><span class="row-copy"><strong>${label}</strong>${detail?`<small>${detail}</small>`:''}</span><span class="switch" aria-hidden="true"></span></button>`}
function group(title,body,helper=''){return `<section class="group"><h4 class="group-title">${title}</h4><div class="box">${body}</div>${helper?`<p class="helper">${helper}</p>`:''}</section>`}
function appearance(){return `<div class="appearance-options" aria-label="Appearance">${['System','Light','Dark'].map(mode=>`<button class="appearance-option" aria-pressed="${mode===state.appearance}" data-appearance="${mode}"><span class="mini-screen ${mode.toLowerCase()}" aria-hidden="true"></span>${mode}</button>`).join('')}</div>`}
function language(){return `<label class="row select-row"><span>Language</span><select aria-label="Language" data-language>${['English','Français','Deutsch','Italiano'].map(language=>`<option${language===state.language?' selected':''}>${language}</option>`).join('')}</select></label>`}
function accountLink(){return row('Account & data','','account')}

function home(){
 const deliveryRows=row('Delivery updates',state.notifications?state.preset:'Off','notifications','bell')+(state.notifications?row('Quiet hours',state.quiet?`${state.start}–${state.end}`:'Off','quiet','moon'):'');
 return profile()+group('Deliveries',deliveryRows)+`<section class="group"><h4 class="group-title">Preferences</h4><div class="box"><div class="preferences-appearance"><strong>Appearance</strong>${appearance()}</div>${language()}</div></section><div class="box account-entry">${accountLink()}</div>`;
}
const presets=[['All tracking updates','Every update, including routine carrier scans.'],['Important only','Delivery, pickup, customs, missed attempts, and returns.'],['Delivery day only','When your parcel goes out for delivery and arrives.']];
function quiet(){return `<div class="box">${toggle('Quiet hours','quiet','Pause alerts during these hours.')}${state.quiet?`<div class="times"><label>From<input type="time" value="${state.start}" data-time="start"></label><label>Until<input type="time" value="${state.end}" data-time="end"></label></div>`:''}</div><p class="helper">Times follow this device’s time zone.</p>`}
function details(route,id){
 if(route==='notifications')return '<h3 class="detail-heading">Delivery updates</h3><p class="detail-intro">Choose which moments are worth an alert.</p>'+group('On this device',toggle('Allow notifications','notifications'))+(state.notifications?`<section class="group"><h4 class="group-title">Notify me about</h4><div class="box" role="radiogroup" aria-label="Delivery updates">${presets.map(([name,detail])=>`<button class="radio-option" role="radio" aria-checked="${state.preset===name}" data-preset="${name}"><span class="radio-circle" aria-hidden="true"></span><span><strong>${name}</strong><small>${detail}</small></span></button>`).join('')}</div></section><section class="group"><h4 class="group-title">A quieter evening</h4>${quiet()}</section>`:'<p class="helper">Your parcels keep tracking while alerts are off.</p>');
 if(route==='quiet')return '<h3 class="detail-heading">Quiet hours</h3><p class="detail-intro">Pause alerts overnight. Catch up when quiet hours end.</p>'+quiet();
 if(route==='appearance')return '<h3 class="detail-heading">Appearance</h3><p class="detail-intro">Choose a look, or let your device decide.</p>'+appearance()+'<p class="helper">System follows your device’s light or dark setting.</p>';
 if(route==='language')return '<h3 class="detail-heading">Language</h3><p class="detail-intro">The language used throughout the app.</p><div class="box">'+language()+'</div>';
 if(route==='privacy-notice')return '<h3 class="detail-heading">Privacy notice</h3><p class="detail-intro">In the app, this opens the full privacy notice.</p><p class="preview-note">This exploration stays local and does not collect your choices.</p>';
 if(route==='account')return '<h3 class="detail-heading">Account & data</h3><p class="detail-intro">Signed in as alex@example.com</p>'+group('Your data',`<button class="row" data-action="export">${svg('download','row-icon')}<span>Download my data</span></button>${row('Privacy notice','','privacy-notice','lock')}`)+`<div class="box"><button class="row" data-action="signout">Sign out</button></div><button class="subtle-button danger" data-route="delete">Delete account</button>${messages[id]?`<p class="preview-message" role="status">${messages[id]}</p>`:''}`;
 if(route==='delete')return '<h3 class="detail-heading">Delete account?</h3><p class="detail-intro">All parcels, tracking history, and notification settings would be erased.</p><p class="preview-message">This is a design preview. No account can be deleted here.</p><button class="primary" data-route="account">Keep my account</button>';
 return '';
}
function render(focus){
 document.querySelector('#previews').innerHTML=`<article class="panel" data-panel="mix" aria-label="Refined settings preview"><header class="panel-header">${routes.mix==='home'?'<h3 tabindex="-1">Settings</h3>':`<button class="back" type="button" data-route="home">${svg('back')} Settings</button>`}</header>${routes.mix==='home'?home():details(routes.mix,'mix')}</article>`;
 if(focus)document.querySelector(focus)?.focus({preventScroll:true});
}
function setTheme(dark){document.body.classList.toggle('dark-canvas',dark);const button=document.querySelector('.preview-theme');button.setAttribute('aria-pressed',String(dark));button.textContent=dark?'Preview light mode':'Preview dark mode'}
document.querySelector('#previews').addEventListener('click',event=>{
 const button=event.target.closest('button');if(!button)return;
 if(button.dataset.route){routes.mix=button.dataset.route;messages.mix='';render(routes.mix==='home'?'.panel-header h3':'.back');return}
 if(button.dataset.toggle){const key=button.dataset.toggle;state[key]=!state[key];render(`[data-toggle="${key}"]`);return}
 if(button.dataset.appearance){state.appearance=button.dataset.appearance;setTheme(state.appearance==='Dark'||state.appearance==='System'&&matchMedia('(prefers-color-scheme:dark)').matches);render(`[data-appearance="${state.appearance}"]`);return}
 if(button.dataset.preset){state.preset=button.dataset.preset;render(`[data-preset="${state.preset}"]`);return}
 if(button.dataset.action){messages.mix=button.dataset.action==='export'?'Preview only—no account data was downloaded.':'Preview only—you are still signed in.';render(`[data-action="${button.dataset.action}"]`)}
});
document.querySelector('#previews').addEventListener('change',event=>{const el=event.target;if(el.hasAttribute('data-language')){state.language=el.value;render('[data-language]')}else if(el.dataset.time){state[el.dataset.time]=el.value;render(`[data-time="${el.dataset.time}"]`)}});
document.querySelector('.preview-theme').addEventListener('click',()=>setTheme(!document.body.classList.contains('dark-canvas')));
render();
</script></body></html>
