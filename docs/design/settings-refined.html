</style></head><body><main>
<header class="mast"><strong>Delivery Tracker <span class="refined-tag">/ Refined settings</span></strong><a href="settings-concepts.html">Previous directions ↗</a></header>
<div class="intro"><h1>Settings, refined.</h1><p>A’s clear groups, C’s visual appearance picker.<br>One shared hierarchy, with room for the iPhone’s extra controls.</p></div>
<div class="toolbar"><label class="account-preview">Preview account<select id="account-mode"><option value="signed-in">Signed in</option><option value="demo">Demo</option></select></label><button class="preview-theme" type="button" aria-pressed="false">Preview dark mode</button></div>
<div class="grid" id="previews"></div>
<footer class="pick"><p>Explore both versions, including their account and demo screens. All controls are local to this preview.</p></footer>
</main><script>
const paths={chevron:'m9 5 7 7-7 7',back:'m15 5-7 7 7 7',bell:'M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4',moon:'M20 15a9 9 0 0 1-11-11A9 9 0 1 0 20 15Z',appearance:'M3 4h18v13H3zM8 21h8M12 17v4',language:'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0ZM3 12h18M12 3c5 5 5 13 0 18-5-5-5-13 0-18Z',lock:'M5 10h14v11H5zM8 10V7a4 4 0 0 1 8 0v3',account:'M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0ZM4 21v-2a8 8 0 0 1 16 0v2',download:'M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5'};
const svg=(name,cls='')=>`<svg viewBox="0 0 24 24" aria-hidden="true" class="${cls}"><path d="${paths[name]}"/></svg>`;

const initial=()=>({appearance:'System',language:'English',notifications:true,preset:'Important only',widgets:true,live:true});
const states={web:initial(),ios:initial()};
const routes={web:'home',ios:'home'};
const messages={};
let demo=false;
paths.widget='M3 3h8v8H3zM15 3h6v8h-6zM3 15h8v6H3zM15 15h6v6h-6z';
paths.live='M3 9v6m4-10v14m5-16v18m5-16v14m4-10v6';
function profile(){return `<div class="profile"><span class="avatar" aria-hidden="true">${demo?'D':'AM'}</span><div><strong>${demo?'Demo account':'Alex Morgan'}</strong><small>${demo?'A little space to try things out':'alex@example.com'}</small></div></div>`}
function row(label,value,route,icon='',subtitle=''){return `<button class="row" data-route="${route}">${icon?svg(icon,'row-icon'):''}<span class="row-copy"><strong>${label}</strong>${subtitle?`<small>${subtitle}</small>`:''}</span>${value?`<span class="value">${value}</span>`:''}${svg('chevron','chevron')}</button>`}
function toggle(label,key,state,detail='',icon=''){return `<button class="toggle-row" role="switch" aria-checked="${state[key]}" aria-label="${label}" data-toggle="${key}">${icon?svg(icon,'row-icon'):''}<span class="row-copy"><strong>${label}</strong>${detail?`<small>${detail}</small>`:''}</span><span class="switch" aria-hidden="true"></span></button>`}
function group(title,body,helper=''){return `<section class="group"><h4 class="group-title">${title}</h4><div class="box">${body}</div>${helper?`<p class="helper">${helper}</p>`:''}</section>`}
function appearance(state){return `<div class="appearance-options" aria-label="Appearance">${['System','Light','Dark'].map(mode=>`<button class="appearance-option" aria-pressed="${mode===state.appearance}" data-appearance="${mode}"><span class="mini-screen ${mode.toLowerCase()}" aria-hidden="true"></span>${mode}</button>`).join('')}</div>`}
function language(state){return `<label class="row select-row"><span>Language</span><select aria-label="Language" data-language>${['English','Français','Deutsch','Italiano'].map(language=>`<option${language===state.language?' selected':''}>${language}</option>`).join('')}</select></label>`}
function home(id){
 const state=states[id];
 const deliveryRows=row('Delivery updates',state.notifications?state.preset:'Off','notifications','bell')+(id==='ios'?toggle('Home Screen widgets','widgets',state,'Your next deliveries, at a glance.','widget')+toggle('Live Activities','live',state,'Out-for-delivery progress on your Lock Screen and Dynamic Island.','live'):'');
 return profile()+group('Deliveries',deliveryRows)+`<section class="group"><h4 class="group-title">Preferences</h4><div class="box"><div class="preferences-appearance"><strong>Appearance</strong>${appearance(state)}</div>${language(state)}</div></section><div class="box account-entry">${row(demo?'Demo & data':'Account & data','','account')}</div>`;
}
const presets=[['All tracking updates','Every update, including routine carrier scans.'],['Important only','Delivery, pickup, customs, missed attempts, and returns.'],['Delivery day only','When your parcel goes out for delivery and arrives.']];
function details(route,id){
 const state=states[id];
 const message=messages[id]?`<p class="preview-message" role="status">${messages[id]}</p>`:'';
 if(route==='notifications')return '<h3 class="detail-heading" tabindex="-1">Delivery updates</h3><p class="detail-intro">Choose which moments are worth an alert.</p>'+group(id==='ios'?'On this iPhone':'In this browser',toggle('Allow notifications','notifications',state))+(state.notifications?`<section class="group"><h4 class="group-title">Notify me about</h4><div class="box" role="radiogroup" aria-label="Delivery updates">${presets.map(([name,detail])=>`<button class="radio-option" role="radio" aria-checked="${state.preset===name}" data-preset="${name}"><span class="radio-circle" aria-hidden="true"></span><span><strong>${name}</strong><small>${detail}</small></span></button>`).join('')}</div></section>`:'<p class="helper">Your parcels keep tracking while alerts are off.</p>');
 if(route==='privacy-notice')return '<h3 class="detail-heading" tabindex="-1">Privacy notice</h3><p class="detail-intro">In the app, this opens the full privacy notice.</p><p class="preview-note">This exploration stays local and does not collect your choices.</p>';
 if(route==='account')return `<h3 class="detail-heading" tabindex="-1">${demo?'Demo & data':'Account & data'}</h3><p class="detail-intro">${demo?'Explore with sample deliveries.':'Signed in as alex@example.com'}</p>`+group('Your data',`<button class="row" data-action="export">${svg('download','row-icon')}<span>Download my data</span></button>${row('Privacy notice','','privacy-notice','lock')}`)+(demo?group('Demo',row('Reset demo','','reset-demo')+'<button class="row" data-action="exit-demo">Exit demo</button>'):`<div class="box"><button class="row" data-action="signout">Sign out</button></div><button class="subtle-button danger" data-route="delete">Delete account</button>`)+message;
 if(route==='delete')return '<h3 class="detail-heading" tabindex="-1">Delete account?</h3><p class="detail-intro">All parcels, tracking history, and notification settings would be erased.</p><p class="preview-message">This is a design preview. No account can be deleted here.</p><button class="primary" data-route="account">Keep my account</button>';
 if(route==='reset-demo')return '<h3 class="detail-heading" tabindex="-1">Reset demo?</h3><p class="detail-intro">Restore the sample deliveries and start again.</p><button class="primary" data-action="reset-demo">Reset demo</button><button class="secondary" data-route="account">Keep exploring</button>'+message;
 return '';
}
function dark(state){return state.appearance==='Dark'||state.appearance==='System'&&matchMedia('(prefers-color-scheme:dark)').matches}
function render(id,focus){
 document.querySelector('#previews').innerHTML=['web','ios'].map(key=>`<section class="direction"><div class="direction-label"><h2>${key==='web'?'Web':'iOS'}</h2><p>${key==='web'?'The essentials, neatly grouped.':'The same foundation, with widgets and Live Activities.'}</p></div><article class="panel ${dark(states[key])?'dark-canvas':'light-panel'}" data-panel="${key}" aria-label="${key==='web'?'Web':'iOS'} settings preview"><header class="panel-header">${routes[key]==='home'?'<h3 tabindex="-1">Settings</h3>':`<button class="back" type="button" data-route="${['privacy-notice','delete','reset-demo'].includes(routes[key])?'account':'home'}">${svg('back')} ${['privacy-notice','delete','reset-demo'].includes(routes[key])?(demo?'Demo & data':'Account & data'):'Settings'}</button>`}</header>${routes[key]==='home'?home(key):details(routes[key],key)}</article></section>`).join('');
 if(id&&focus)document.querySelector(`[data-panel="${id}"] ${focus}`)?.focus({preventScroll:true});
}
document.querySelector('#previews').addEventListener('click',event=>{
 const button=event.target.closest('button');if(!button)return;
 const id=button.closest('[data-panel]').dataset.panel,state=states[id];
 if(button.dataset.route){routes[id]=button.dataset.route;messages[id]='';render(id,routes[id]==='home'?'.panel-header h3':'.detail-heading');return}
 if(button.dataset.toggle){const key=button.dataset.toggle;state[key]=!state[key];render(id,`[data-toggle="${key}"]`);return}
 if(button.dataset.appearance){state.appearance=button.dataset.appearance;render(id,`[data-appearance="${state.appearance}"]`);return}
 if(button.dataset.preset){state.preset=button.dataset.preset;render(id,`[data-preset="${state.preset}"]`);return}
 if(button.dataset.action){const copy={export:'Preview only—no account data was downloaded.',signout:'Preview only—you are still signed in.','exit-demo':'Preview only—the live demo has not changed.','reset-demo':'Preview only—sample deliveries would be restored.'};messages[id]=copy[button.dataset.action];render(id,`[data-action="${button.dataset.action}"]`)}
});
document.querySelector('#previews').addEventListener('change',event=>{const el=event.target;if(el.hasAttribute('data-language')){const id=el.closest('[data-panel]').dataset.panel;states[id].language=el.value;render(id,'[data-language]')}});
document.querySelector('#account-mode').addEventListener('change',event=>{demo=event.target.value==='demo';for(const id of ['web','ios']){routes[id]='home';messages[id]=''}render()});
document.querySelector('.preview-theme').addEventListener('click',event=>{const isDark=!document.body.classList.contains('dark-canvas');document.body.classList.toggle('dark-canvas',isDark);for(const state of Object.values(states))state.appearance=isDark?'Dark':'Light';event.currentTarget.setAttribute('aria-pressed',String(isDark));event.currentTarget.textContent=isDark?'Preview light mode':'Preview dark mode';render()});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>render());
render();
</script></body></html>
