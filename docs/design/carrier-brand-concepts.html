<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carrier marks · Delivery Tracker</title>
<style>
:root { color-scheme:light; --canvas:#f5f5ef; --ink:#252a22; --muted:#7b8176; --line:#dedfd5; --paper:#fffef8; --yellow:#f5d543; --blue:#deebf9; --cream:#eee6d8; --stamp:#fffbed; --stamp-ink:#655b38; }
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #577cad;outline-offset:4px}main{max-width:1240px;margin:auto;padding:46px 36px 60px}.masthead{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:22px}.app-name{font-size:13px;font-weight:650;letter-spacing:-.2px}.edition{color:var(--muted);font-size:12px}.intro{display:flex;align-items:end;justify-content:space-between;gap:24px;margin:36px 0 28px}h1{font-size:34px;line-height:1.1;letter-spacing:-1.25px;font-weight:650;margin:0 0 10px}.intro p{font-size:14px;color:var(--muted);margin:0;line-height:1.5}.theme{border:1px solid var(--line);background:transparent;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;color:var(--ink)}.theme svg{width:17px;height:17px}.tabs{display:flex;gap:3px;padding:4px;background:var(--line);border-radius:13px;width:max-content;flex-shrink:0}.tabs button{border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:12px;padding:9px 12px;white-space:nowrap}.tabs button[aria-pressed=true]{color:var(--ink);background:var(--paper);box-shadow:0 1px 3px #00000008}.concepts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px}.concept{min-width:0}.concept-head{min-height:100px;padding-top:6px}.number{font-size:10px;color:var(--muted);letter-spacing:1px}.concept h2{margin:8px 0 7px;font-size:19px;letter-spacing:-.45px;font-weight:650}.concept-head p{margin:0;font-size:12px;color:var(--muted);line-height:1.5}.cards{display:grid;gap:16px}.ticket{position:relative;border-radius:24px;padding:19px 20px 17px;background:var(--card);min-width:0}.dhl{--card:var(--yellow);--brand:#d40511;--truck:#ffcc00;--truck-edge:#b88600;--accent:#d40511;--brand-label:#fff0b4;--detail:#725a1f}.gls{--card:var(--blue);--brand:#172ba1;--truck:#172ba1;--truck-edge:#172ba1;--accent:#ffcf00;--brand-label:#f1f5ff;--detail:#3d6586}.ups{--card:var(--cream);--brand:#4b3024;--truck:#533427;--truck-edge:#533427;--accent:#f5c86b;--brand-label:#fff8eb;--detail:#766653}.ticket-top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:24px}.carrier{display:inline-flex;align-items:center;gap:7px;color:var(--brand);flex-shrink:0}.carrier-name{font-size:13px;letter-spacing:.1px;line-height:1;font-weight:750}.dhl .carrier-name{font-style:italic;font-weight:850;letter-spacing:-.5px}.gls .carrier-name{font-weight:800;letter-spacing:-.45px}.gls .carrier-name::after{content:'.';color:#c49600}.ups .carrier-name{font-weight:700;letter-spacing:-.5px;text-transform:lowercase}.truck{width:27px;height:18px;display:block;overflow:visible;flex-shrink:0}.state{font-size:10px;font-weight:400;color:var(--detail);white-space:nowrap}.main-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0 17px;min-height:76px}.copy{min-width:0}.eta{font-size:26px;font-weight:650;line-height:1.15;letter-spacing:-1px;margin:0 0 7px;white-space:nowrap}.parcel-name{font-size:14px;line-height:1.4;letter-spacing:-.2px;margin:0;font-weight:500}.stamp{flex-shrink:0;width:58px;height:70px;padding:8px;background:var(--stamp);color:var(--stamp-ink);transform:rotate(-4deg);position:relative;clip-path:polygon(0 4%,5% 0,11% 4%,17% 0,23% 4%,29% 0,35% 4%,41% 0,47% 4%,53% 0,59% 4%,65% 0,71% 4%,77% 0,83% 4%,89% 0,95% 4%,100% 0,96% 7%,100% 14%,96% 21%,100% 28%,96% 35%,100% 42%,96% 49%,100% 56%,96% 63%,100% 70%,96% 77%,100% 84%,96% 91%,100% 98%,94% 100%,88% 96%,82% 100%,76% 96%,70% 100%,64% 96%,58% 100%,52% 96%,46% 100%,40% 96%,34% 100%,28% 96%,22% 100%,16% 96%,10% 100%,4% 96%,0 100%,4% 91%,0 84%,4% 77%,0 70%,4% 63%,0 56%,4% 49%,0 42%,4% 35%,0 28%,4% 21%,0 14%,4% 7%)}.stamp-print{height:100%;border:1px solid #baad85;background:#f3e9be;display:grid;place-items:center}.stamp svg{width:25px;height:25px;stroke-width:1.2}.stamp:after{content:'';position:absolute;right:-4px;bottom:4px;width:27px;height:27px;border:1px solid #91856666;outline:1px solid #91856633;outline-offset:-5px;border-radius:50%}.rail{display:flex;gap:4px;height:3px}.rail i{flex:1;background:var(--detail);border-radius:2px;opacity:.23}.rail i.filled{opacity:.8}.outline .carrier-name{font-size:13px;font-weight:650;font-style:normal;letter-spacing:0;text-transform:none}.outline .truck{width:25px;height:17px}.outline .gls .carrier-name::after{content:none}.label .carrier{background:var(--brand-label);padding:5px 8px 5px 7px;border-radius:6px;gap:6px}.label .truck{width:23px;height:15px}.label .carrier-name{font-size:12px}.foot{font-size:12px;line-height:1.6;color:var(--muted);border-top:1px solid var(--line);margin-top:32px;padding-top:19px}.foot strong{font-weight:600;color:var(--ink)}.single .concepts{grid-template-columns:minmax(0,370px);justify-content:center}.single .concept[hidden]{display:none}.single .concept-head{min-height:90px}body.dark{color-scheme:dark;--canvas:#1e221e;--ink:#f3f3e8;--muted:#a1a999;--line:#373c33;--paper:#42483c;--yellow:#514619;--blue:#253b50;--cream:#42382c}.dark .dhl{--brand:#ffda51;--detail:#d8bd75;--brand-label:#6a4f22}.dark .gls{--brand:#bdd3ff;--detail:#a2c5e7;--brand-label:#364f6c}.dark .ups{--brand:#f2d499;--detail:#cfba91;--brand-label:#61503b}
@media(min-width:1100px){.eta{font-size:29px}}
@media(max-width:1000px){main{padding:30px 22px 44px}.intro{align-items:start;flex-direction:column}.concepts{gap:16px}.ticket{padding:16px}.eta{font-size:22px}.stamp{width:49px;height:62px}.state{font-size:9px}.carrier{gap:5px}.carrier-name{font-size:12px}.main-row{gap:7px}.concept-head{min-height:112px}}
@media(max-width:740px){main{padding:24px 20px 40px}.edition{font-size:10px}h1{font-size:29px}.intro{margin:26px 0 22px;gap:20px}.tabs{width:100%;justify-content:space-between}.tabs button{flex:1;padding:9px 8px}.concepts{grid-template-columns:1fr;gap:34px}.concept-head{min-height:0;margin-bottom:17px}.concept-head p{font-size:13px}.cards{gap:13px}.ticket{padding:18px 20px}.eta{font-size:28px}.stamp{width:58px;height:70px}.state{font-size:10px}.carrier-name{font-size:13px}.main-row{gap:12px}.single .concepts{grid-template-columns:minmax(0,390px)}.foot{margin-top:26px}}
@media(prefers-reduced-motion:no-preference){button{transition:background .15s,color .15s}.stamp{transition:transform .25s}.ticket:hover .stamp{transform:rotate(-1deg)}}
</style>
</head>
<body>
<main>
<header class="masthead"><span class="app-name">Delivery Tracker <span class="edition">/ Carrier study</span></span><button class="theme" type="button" aria-label="Switch to dark mode" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M20 15a9 9 0 0 1-11-11A9 9 0 1 0 20 15Z"/></svg></button></header>
<div class="intro"><div><h1>A little more carrier.</h1><p>A tiny truck, a familiar name. The ETA stays just below.</p></div><nav class="tabs" aria-label="Design directions"><button type="button" data-view="all" aria-pressed="true">Compare</button><button type="button" data-view="fleet" aria-pressed="false">01 Fleet</button><button type="button" data-view="outline" aria-pressed="false">02 Outline</button><button type="button" data-view="label" aria-pressed="false">03 Label</button></nav></div>
<div class="concepts" id="concepts"></div>
<p class="foot"><strong>My pick: 01 Fleet.</strong> The miniature truck carries the brand colors without adding another badge. These are adapted sketches; the rest of the ticket stays familiar.</p>
</main>
<script>
const brands=[{id:'dhl',name:'DHL',eta:'Tomorrow',parcel:'New sneakers',status:'On the way',progress:4},{id:'gls',name:'GLS',eta:'Fri 11 Sep',parcel:'Camera strap',status:'In transit',progress:3},{id:'ups',name:'UPS',eta:'Sat 12 Sep',parcel:'Coffee grinder',status:'Announced',progress:1}];
const directions=[{id:'fleet',name:'Fleet',description:'A tiny delivery truck in the carrier’s colors.'},{id:'outline',name:'Outline',description:'A fine-line truck. More air, less visual weight.'},{id:'label',name:'Label',description:'A soft label, like a small printed shipping mark.'}];
function truck(brand,style){
 const line=style==='outline';
 const livery=brand==='dhl'?'<path d="M4 8h12M3 10h12" stroke="var(--accent)" stroke-width="1.1"/>':brand==='gls'?'<path d="M5 9h8" stroke="var(--accent)" stroke-width="2"/><circle cx="15" cy="9" r="1.1" fill="var(--accent)"/>':'<path d="M8 5h5v4c0 2-2.5 3-2.5 3S8 11 8 9Z" fill="var(--accent)"/>';
 return `<svg class="truck" viewBox="0 0 32 21" aria-hidden="true" fill="none">${line?'<path d="M2 4h17v12H2zM19 9h6l5 5v2H19M22 9v5h8" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/><path d="M4 7h10" stroke="var(--accent)" stroke-width="1.4"/>':`<rect x="2" y="3" width="18" height="13" rx="1.3" fill="var(--truck)" stroke="var(--truck-edge)" stroke-width=".6"/><path d="M20 8h5l5 5v3H20Z" fill="var(--truck)" stroke="var(--truck-edge)" stroke-width=".6"/><path d="M22 9.5h2.5l3 3H22Z" fill="#edf1ee" opacity=".9"/>${livery}`}<circle cx="8" cy="16.5" r="2.4" fill="${line?'var(--card)':'#42483d'}" stroke="${line?'currentColor':'#42483d'}" stroke-width="1.1"/><circle cx="25" cy="16.5" r="2.4" fill="${line?'var(--card)':'#42483d'}" stroke="${line?'currentColor':'#42483d'}" stroke-width="1.1"/>${line?'':'<circle cx="8" cy="16.5" r=".9" fill="#d2d4c7"/><circle cx="25" cy="16.5" r=".9" fill="#d2d4c7"/>'}</svg>`;
}
const stamp='<div class="stamp" aria-hidden="true"><div class="stamp-print"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h11v12H3V5Zm11 5h4l3 4v3h-7M6 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm12 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/></svg></div></div>';
document.querySelector('#concepts').innerHTML=directions.map((direction,index)=>`<section class="concept ${direction.id}" data-concept="${direction.id}" aria-labelledby="heading-${direction.id}"><div class="concept-head"><span class="number">0${index+1}</span><h2 id="heading-${direction.id}">${direction.name}</h2><p>${direction.description}</p></div><div class="cards">${brands.map(brand=>`<article class="ticket ${brand.id}" aria-label="${brand.name}: ${brand.parcel}, ${brand.eta}"><div class="ticket-top"><span class="carrier">${truck(brand.id,direction.id)}<span class="carrier-name">${brand.name}</span></span><span class="state">${brand.status}</span></div><div class="main-row"><div class="copy"><p class="eta">${brand.eta}</p><h3 class="parcel-name">${brand.parcel}</h3></div>${stamp}</div><div class="rail" aria-hidden="true">${Array.from({length:6},(_,i)=>`<i class="${i<brand.progress?'filled':''}"></i>`).join('')}</div></article>`).join('')}</div></section>`).join('');
document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{
 const view=button.dataset.view;
 document.body.classList.toggle('single',view!=='all');
 document.querySelectorAll('[data-view]').forEach(tab=>tab.setAttribute('aria-pressed',String(tab===button)));
 document.querySelectorAll('[data-concept]').forEach(section=>section.hidden=view!=='all'&&section.dataset.concept!==view);
}));
document.querySelector('.theme').addEventListener('click',event=>{const dark=document.body.classList.toggle('dark');event.currentTarget.setAttribute('aria-pressed',String(dark));event.currentTarget.setAttribute('aria-label',`Switch to ${dark?'light':'dark'} mode`);});
</script>
</body>
</html>
